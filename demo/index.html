<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d1a">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<title>Weekly Routine Clock</title>
<style id="app-style">
  :root{
    --bg:#080d1a;
    --bg-grad:#0c1428;
    --surface:#111a30;
    --surface-2:#182545;
    --surface-3:#22315a;
    --border:#28365a;
    --border-soft:#1b2846;
    --text:#eef1fb;
    --text-dim:#a7b2cf;
    --text-mute:#6d7897;
    --accent:#f5b95c;
    --accent-ink:#241505;
    --danger:#e66767;
    --gap-ring:#0a0f1e;
    --unassigned:#243354;
    --switch-alt:#4a78c9;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  html{ scrollbar-gutter:stable; }  /* page width (and the top controls) don't shift when a scrollbar appears */
  body{ background: radial-gradient(1100px 700px at 15% -8%, var(--bg-grad), var(--bg) 60%); color:var(--text); }
  #app{
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width:1600px; margin:0 auto;
    /* safe-area insets keep content clear of the notch / home bar when installed as an app */
    padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right));
    padding-top:calc(22px + env(safe-area-inset-top)); padding-bottom:calc(40px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:18px;
  }
  h1,h2,h3{ font-family:"Sora", ui-sans-serif, system-ui, sans-serif; margin:0; letter-spacing:-0.01em; text-wrap:balance; }
  .tabular{ font-variant-numeric:tabular-nums; }

  /* ---- top bar ---- */
  .topbar{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand h1{ font-size:2.025rem; font-weight:800; color:var(--text); }
  .controls{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; }
  .ctl-actions, .ctl-switches{ display:flex; align-items:center; gap:10px; }
  .ctl-switches .switch-label{ min-width:4.2em; }
  .switchwrap.is-placeholder{ visibility:hidden; pointer-events:none; }
  /* phones: buttons on one row, switches on the next, whatever the mode — so the mode switch never jumps */
  @media (max-width:520px){ .ctl-actions, .ctl-switches{ flex:1 0 100%; } }
  .readonly-badge{ font-size:.72rem; font-weight:600; color:var(--text-mute); border:1px solid var(--border); border-radius:999px; padding:4px 10px; white-space:nowrap; cursor:pointer; }
  .readonly-badge:hover{ border-color:var(--accent); color:var(--text); }
  /* Android app only: the notification/app settings panel (see NATIVE) */
  .nset{ display:flex; flex-direction:column; }
  .nset-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; }
  .nset-row + .nset-row{ border-top:1px solid var(--border-soft); }
  .nset-row.is-off{ opacity:.45; }
  .nset-text{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .nset-title{ font-size:.88rem; font-weight:600; color:var(--text); }
  .nset-sub{ font-size:.74rem; color:var(--text-mute); line-height:1.45; }
  /* inside the Android app the WebView already sits between the system bars, so the page's own
     safe-area padding would only double the gaps at the top and bottom */
  html.native #app{ padding-top:14px; padding-bottom:12px; }
  html.native .savebar{ bottom:6px; }
  html.native .toast{ bottom:18px; }
  .nset-ok{ font-size:.74rem; font-weight:700; color:#4cc38a; white-space:nowrap; }
  .nset-actions{ display:flex; flex-wrap:wrap; gap:8px; padding-top:4px; }
  .nset-row .btn{ flex:0 0 auto; white-space:nowrap; padding:8px 14px; }
  .lock-btn{ appearance:none; border:1px solid var(--border); background:var(--surface-2); color:var(--text-mute); font:inherit; font-size:.72rem; font-weight:600; padding:5px 10px; border-radius:999px; cursor:pointer; }
  .lock-btn:hover{ border-color:var(--danger); color:var(--danger); }
  .lock-btn.active, .lock-btn.active:hover{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .refresh-btn:hover{ border-color:var(--accent); color:var(--text); }
  .refresh-btn:disabled{ opacity:.6; cursor:default; }
  .switchwrap{ display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
  .switchwrap input{ position:absolute; opacity:0; width:0; height:0; }
  .switch-track{ width:40px; height:22px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); position:relative; flex:0 0 auto; transition:background .2s ease, border-color .2s ease; }
  .switch-thumb{ position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--text-mute); transition:transform .2s ease, background .2s ease; }
  .switchwrap input:checked + .switch-track{ background:var(--accent); border-color:var(--accent); }
  .switchwrap input:checked + .switch-track .switch-thumb{ transform:translateX(18px); background:var(--accent-ink); }
  /* switches that pick between two views (시현/편집, 일간/주간, 시간별/총시간) rather than turning
     something on or off: both sides are coloured — blue on the left, amber on the right */
  .switchwrap.dual .switch-track{ background:var(--switch-alt); border-color:var(--switch-alt); }
  .switchwrap.dual .switch-thumb{ background:var(--text); }
  .switch-label{ font-size:.82rem; font-weight:600; color:var(--text-dim); }

  /* ---- day tabs ---- */
  /* the 7 tabs share the row width equally, so they never scroll sideways */
  .daytabs{ display:flex; gap:6px; }
  .daytab{ appearance:none; flex:1 1 0; min-width:0; max-width:88px; position:relative; text-align:center; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font:inherit; font-weight:600; font-size:.85rem; padding:9px 0; border-radius:12px; cursor:pointer; }
  .daytab.active{ background:var(--surface-3); color:var(--text); border-color:var(--accent); }
  .daytab.today::after{ content:""; position:absolute; left:50%; bottom:4px; width:5px; height:5px; border-radius:50%; background:var(--accent); transform:translateX(-50%); }

  /* ---- case bar ---- */
  .casebar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .caseselect{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:8px 10px; font:inherit; font-size:.85rem; min-width:160px; }
  .icon-btn{ appearance:none; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font:inherit; font-size:.78rem; font-weight:600; padding:8px 11px; border-radius:10px; cursor:pointer; white-space:nowrap; }
  .icon-btn:hover{ border-color:var(--accent); color:var(--text); }
  .icon-btn.danger:hover{ border-color:var(--danger); color:var(--danger); }
  .icon-btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* ---- panels ---- */
  .panel{ background:var(--surface); border:1px solid var(--border-soft); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .panel-title{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .panel-title h2{ font-size:.95rem; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; }
  .hint{ font-size:.78rem; color:var(--text-mute); line-height:1.5; }

  /* ---- block form ---- */
  .blockform{ display:flex; flex-wrap:wrap; align-items:end; gap:10px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:.7rem; color:var(--text-mute); font-weight:600; }
  .timepair{ display:flex; gap:4px; align-items:center; }
  select, input[type="text"]{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 8px; font:inherit; font-size:.82rem; }
  select:focus, input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .field.grow{ flex:1 1 160px; }
  .btn{ appearance:none; border:1px solid transparent; border-radius:10px; padding:9px 16px; font:inherit; font-weight:700; font-size:.83rem; cursor:pointer; }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); }
  .btn.primary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.ghost{ background:var(--surface-2); color:var(--text-dim); border-color:var(--border); }
  .btn.ghost:hover{ color:var(--text); border-color:var(--accent); }
  .formerr{ color:var(--danger); font-size:.78rem; font-weight:600; }

  /* ---- block list ---- */
  .blocklist{ display:flex; flex-direction:column; border-radius:12px; overflow:hidden; border:1px solid var(--border-soft); }
  .blockrow{ display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--surface-2); }
  .blockrow + .blockrow{ border-top:1px solid var(--border-soft); }
  .blockrow.overlap{ box-shadow:inset 3px 0 0 var(--danger); }
  .swatch{ width:11px; height:11px; border-radius:3px; flex:0 0 auto; }
  .blockrow .time{ font-size:.8rem; color:var(--text-dim); white-space:nowrap; }
  .blockrow .lbl{ flex:1 1 auto; font-size:.85rem; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .blockrow .warn{ font-size:.7rem; color:var(--danger); font-weight:700; white-space:nowrap; }
  .rowbtn{ appearance:none; border:none; background:transparent; color:var(--text-mute); cursor:pointer; font-size:.95rem; padding:4px 6px; line-height:1; }
  .rowbtn:hover{ color:var(--accent); }
  .rowbtn.del:hover{ color:var(--danger); }
  .empty{ padding:16px; text-align:center; color:var(--text-mute); font-size:.85rem; }

  /* ---- categories ---- */
  .catlist{ display:flex; flex-direction:column; gap:6px; }
  .catrow{ display:flex; align-items:center; gap:8px; }
  .catrow input[type="color"]{ width:30px; height:30px; padding:0; border:1px solid var(--border); border-radius:8px; background:none; cursor:pointer; }
  .catrow input[type="text"]{ flex:1 1 auto; min-width:0; }

  /* ---- clock ---- */
  .clocksection{ display:flex; flex-wrap:wrap; gap:22px; align-items:center; justify-content:center; }
  .clockwrap{ flex:0 0 auto; }
  .clockmeta{ flex:1 1 220px; min-width:220px; display:flex; flex-direction:column; gap:10px; }
  .clockmeta h3{ font-size:1.05rem; color:var(--text); }
  .clockmeta .sub{ font-size:.8rem; color:var(--text-mute); margin-top:-6px;}
  .legend{ display:flex; flex-direction:column; gap:7px; }
  /* under each clock: "시간별 상태" (the blocks, like the widget's list) and "카테고리별 총시간".
     Wide enough (≥440px): both, side by side. Narrower (phones, weekly cards): one at a time,
     picked with the switch in the header (shared by every clock, remembered on this device). */
  .lgbox{ container-type:inline-size; width:100%; display:flex; flex-direction:column; gap:8px; }
  .lghead{ display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:24px; }
  .lgtitle{ font-size:.74rem; font-weight:700; color:var(--text-dim); letter-spacing:.02em; text-transform:none; }
  .lghead .lgtitle .t-totals, .lgbox[data-mode="totals"] .lghead .t-timeline{ display:none; }
  .lgbox[data-mode="totals"] .lghead .t-totals{ display:inline; }
  .lgcols{ display:grid; grid-template-columns:minmax(0,1fr); gap:6px 22px; align-items:start; }
  .lgcol{ min-width:0; }
  .lgcol > .lgtitle{ display:none; margin-bottom:7px; }
  .lgbox[data-mode="timeline"] .lgcol.totals, .lgbox[data-mode="totals"] .lgcol.timeline{ display:none; }
  @container (min-width:440px){
    .lghead{ display:none; }
    .lgcols{ grid-template-columns:repeat(2, minmax(0,1fr)); }
    .lgbox[data-mode] .lgcol.timeline, .lgbox[data-mode] .lgcol.totals{ display:block; }
    .lgcol > .lgtitle{ display:block; }
  }
  .tlitem{ display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--text); padding:2px 6px; margin:0 -6px; border:1px solid transparent; border-radius:6px; }
  .tlitem .tm{ color:var(--text-dim); white-space:nowrap; font-size:.76rem; }
  .tlitem .nm{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tlitem.now{ background:rgba(245,185,92,.16); border-color:var(--accent); }
  .tl-empty{ font-size:.78rem; color:var(--text-mute); }
  @media (min-width:521px){
  }
  .legenditem{ display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--text-dim); }
  .legenditem .dur{ margin-left:auto; color:var(--text-mute); font-size:.76rem; }
  .now-line{ font-size:.8rem; color:var(--accent); font-weight:700; }
  /* a clicked slice pops out (scaled about the clock's centre) and the others dim */
  svg.clock .seg{ cursor:pointer; transform-box:view-box; transform-origin:50% 50%; transition:transform .25s ease, opacity .25s ease, filter .25s ease; }
  svg.clock.has-sel .seg{ opacity:.3; filter:blur(.7px) saturate(.6); }
  svg.clock.has-sel .seg.sel{ opacity:1; filter:drop-shadow(0 0 6px rgba(0,0,0,.55)); transform:scale(1.07); }
  svg.clock .c-sel, svg.clock.has-sel .c-def{ display:none; }
  svg.clock.has-sel .c-sel{ display:inline; }
  /* "지금" bar: what the routine says you should be doing right now (today's active case) */
  .nowbar{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border-soft); border-left:4px solid var(--nowbar-color, var(--unassigned)); border-radius:14px; padding:10px 14px; }
  .nowbar-tag{ flex:0 0 auto; font-size:.72rem; font-weight:700; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:2px 8px; }
  .nowbar-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .nowbar-title{ font-family:"Sora", ui-sans-serif, system-ui, sans-serif; font-weight:700; font-size:1rem; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nowbar-title .memo{ font-family:"IBM Plex Sans", system-ui, sans-serif; font-weight:500; font-size:.85rem; color:var(--text-dim); }
  .nowbar-sub{ font-size:.78rem; color:var(--text-mute); line-height:1.5; }
  .nowbar-sub b{ color:var(--text-dim); font-weight:600; }
  .daily-swipe{ cursor:grab; touch-action:pan-y; }
  .daily-swipe:active{ cursor:grabbing; }

  /* ---- weekly display grid ---- */
  .daygrid{ display:flex; gap:22px; overflow-x:auto; overflow-y:hidden; padding-block:2px 12px; cursor:grab; scrollbar-width:thin; scrollbar-color:var(--border) transparent; -webkit-overflow-scrolling:touch; }
  .daygrid.dragging{ cursor:grabbing; user-select:none; -webkit-user-select:none; }
  .daygrid::-webkit-scrollbar{ height:8px; }
  .daygrid::-webkit-scrollbar-thumb{ background:var(--border); border-radius:999px; }
  .daygrid::-webkit-scrollbar-track{ background:transparent; }
  .daycard{ background:var(--surface-2); border:1px solid var(--border-soft); border-radius:14px; padding:14px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; flex:0 0 clamp(180px, 88%, 320px); min-width:0; max-width:100%; }
  .daycard-head{ display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; }
  .daycard-label{ font-family:"Sora", ui-sans-serif, system-ui, sans-serif; font-weight:700; font-size:.85rem; color:var(--text); }
  .daycard-label.today{ color:var(--accent); }
  .caseselect.small{ width:100%; font-size:.74rem; padding:6px 6px; min-width:0; }
  .daycard .legend{ width:100%; gap:4px; }
  .daycard .legenditem{ font-size:.7rem; gap:6px; }
  .daycard .tlitem{ font-size:.7rem; gap:6px; }
  .daycard .tlitem .tm{ font-size:.66rem; }
  .daycard .lgbox{ gap:6px; }

  /* ---- data tools / save bar ---- */
  /* the save bar follows the scroll (status + save); the JSON backup tools sit at the very end */
  .savebar{ position:sticky; bottom:calc(8px + env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:8px 8px 8px 14px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .savebar .status{ flex:1 1 auto; min-width:0; font-size:.78rem; color:var(--text-mute); }
  .savebar .status.dirty{ color:var(--accent); font-weight:600; }
  .savebar .btn{ flex:0 0 auto; white-space:nowrap; }
  .datatools{ display:flex; gap:8px; flex-wrap:wrap; }

  /* lives outside #app so re-renders (renderApp) don't wipe a message that is showing */
  .toast{ font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--surface-3); border:1px solid var(--accent); color:var(--text); font-size:.82rem; font-weight:600; padding:10px 18px; border-radius:999px; box-shadow:0 12px 30px rgba(0,0,0,.4); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; max-width:min(90vw,420px); text-align:center; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  .demo-banner{ background:#182545; color:#eef1fb; font-size:.78rem; text-align:center; padding:9px 12px; border-bottom:1px solid #28365a; font-family:"IBM Plex Sans",system-ui,sans-serif; }
  .demo-banner a{ display:inline-block; margin:2px 0 0 6px; color:#241505; background:#f5b95c; font-weight:700; text-decoration:none; border-radius:999px; padding:2px 10px; white-space:nowrap; }
  .demo-banner a:hover{ background:#ffd08a; }
  html.widget .demo-banner, html.native .demo-banner{ display:none; }

  @media (max-width:520px){
    .clocksection{ flex-direction:column; }
    .clockmeta{ min-width:0; width:100%; }
    .blockform{ flex-direction:column; align-items:stretch; }
    .field.grow{ flex:1 1 auto; }
  }
  @media (prefers-reduced-motion:reduce){
    .toast, svg.clock .seg{ transition:none; }
  }

  /* ---- ?view=widget: compact week strip for the PC desktop widget (desktop-widget/) ---- */
  html.widget{ scrollbar-gutter:auto; overflow:hidden; font-size:clamp(13px, 1.15vw, 18px); }
  html.widget body{ background:var(--bg); overflow:hidden; }
  html.widget #app{ max-width:none; height:100%; padding:10px 12px; gap:8px; }
  html.widget .nowbar{ padding:6px 12px; border-radius:12px; flex:0 0 auto; }
  html.widget .nowbar-title{ font-size:.9rem; }
  html.widget .nowbar-sub{ font-size:.72rem; line-height:1.35; }
  /* one day at a time, laid out like the Android widget: time + clock on the left 40%, the rest on the right */
  .wbody{ flex:1 1 auto; min-height:0; display:flex; gap:12px; user-select:none; -webkit-user-select:none; }
  .wleft{ flex:0 0 40%; min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .wnow-time{ font-family:"Sora", ui-sans-serif, system-ui, sans-serif; font-weight:800; font-size:1.3rem; line-height:1.15; color:var(--text); }
  .wclock{ flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  .wclock svg{ width:auto !important; height:100% !important; max-width:100%; max-height:100%; }
  .wright{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .whead{ display:flex; align-items:center; gap:6px; }
  .wday-title{ flex:0 0 auto; font-family:"Sora", ui-sans-serif, system-ui, sans-serif; font-weight:700; font-size:.85rem; color:var(--text); white-space:nowrap; }
  .wday-title.today{ color:var(--accent); }
  .wcase-select{ flex:1 1 auto; min-width:0; font-size:.72rem; padding:3px 8px; border-radius:999px; background:var(--surface-2); color:var(--text-dim); cursor:pointer; }
  .wcase-select:hover{ border-color:var(--accent); color:var(--text); }
  /* "앱 열기": only while the pointer is over the widget; keeps its space so nothing shifts */
  .wopen{ flex:0 0 auto; visibility:hidden; opacity:0; transition:opacity .2s ease, visibility .2s; font-size:.72rem; font-weight:700; color:var(--accent-ink); background:var(--accent); border-radius:999px; padding:3px 10px; text-decoration:none; white-space:nowrap; }
  html.widget:hover .wopen{ visibility:visible; opacity:1; }
  .wlist{ flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:1px; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .wrow{ display:flex; align-items:center; gap:7px; padding:2px 6px; border:1px solid transparent; border-radius:6px; font-size:.76rem; }
  .wrow.now{ background:rgba(245,185,92,.2); border-color:var(--accent); }
  .wrow .wdot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .wrow .wtime{ color:var(--text-dim); white-space:nowrap; }
  .wrow .wlbl{ color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wlist .empty{ padding:10px; font-size:.75rem; }
  .wdays{ flex:0 0 auto; display:flex; justify-content:center; gap:3px; }
  .wday{ appearance:none; border:1px solid transparent; background:transparent; color:var(--text-mute); font:inherit; font-size:.68rem; font-weight:600; padding:1px 6px; border-radius:6px; cursor:pointer; }
  .wday:hover{ color:var(--text); }
  .wday.today{ color:var(--accent); }
  .wday.active{ background:var(--surface-3); border-color:var(--border); color:var(--text); }
  .wday-title .wd-short{ display:none; }
  /* narrow widget (about 320px): short day name, one-line "지금", and "앱 열기" floats over the corner
     instead of keeping its own space, so the case dropdown stays usable */
  @media (max-width:420px){
    html.widget #app{ padding:8px; gap:6px; }
    html.widget .wbody{ gap:8px; }
    html.widget .nowbar{ padding:5px 8px; gap:6px; border-radius:10px; }
    html.widget .nowbar-tag{ display:none; }
    html.widget .nowbar-sub{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

<script>
/* demo only: pretends to be the Android app's WRNative bridge so the "⚙ 알림" panel works.
   Nothing leaves this page; settings live in memory until the page is closed. */
(function(){
  if (!/[?&]app=1(&|$)/.test(location.search)) return;
  var settings = {notify:true, sound:true, vibrate:true, notifyGaps:true};
  var bridge = {
    onmessage: null,
    postMessage: function(raw){
      var m = JSON.parse(raw), a = m.args || {}, r = true;
      switch (m.op){
        case 'getSettings': r = settings; break;
        case 'setSetting': settings[a.key] = !!a.value; break;
        case 'getPermissions': r = {notifications:true, exactAlarm:true, battery:false}; break;
        case 'getInfo': r = {lastSync: Date.now(), version: '데모'}; break;
        case 'getToken': r = ''; break;
        case 'sendTestNotification':
          r = {ok:true};
          try{ parent.postMessage({demoNotification: true}, '*'); }catch(e){}
          break;
        case 'saveFile':
          var url = URL.createObjectURL(new Blob([a.content], {type:'application/json'}));
          var link = document.createElement('a'); link.href = url; link.download = a.name;
          document.body.appendChild(link); link.click(); link.remove();
          setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
          r = {ok:true};
          break;
      }
      setTimeout(function(){ if (bridge.onmessage) bridge.onmessage({data: JSON.stringify({id:m.id, result:r})}); }, 30);
    }
  };
  window.WRNative = bridge;
})();
</script>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  "use strict";

  /* ============== backend ============== */
  // Demo build (demo/build-demo.py): intentionally has no backend, so it only ever shows the
  // built-in example data and never reads/writes any real account's routine.
  var API_BASE = "";
  var TOKEN_KEY = 'weekly-routine-DEMO-write-token';
  var LS_CACHE_KEY = 'weekly-routine-DEMO-cache-v1';
  // ?view=widget renders only the "지금" bar + the week strip, for the PC desktop widget (desktop-widget/)
  var WIDGET_VIEW = /[?&]view=widget(&|$)/.test(location.search);
  if (WIDGET_VIEW) document.documentElement.classList.add('widget');
  // set when the widget page runs inside the desktop app (desktop-widget/), which handles move/resize/menu
  var HOST = WIDGET_VIEW && window.chrome && window.chrome.webview ? window.chrome.webview : null;
  if (HOST) document.documentElement.classList.add('hosted');
  // cases picked in the widget without an edit token: kept on this PC only, {dayKey: caseId}
  var CASE_OVERRIDES_KEY = 'weekly-routine-DEMO-case-overrides';
  // set when the page runs inside the Android app (android/ MainActivity), which injects this bridge:
  // notification settings and permissions, the shared edit token, and pushing the routine to the widget
  var NATIVE = window.WRNative || null;
  var nativeSeq = 0, nativeWaiting = {};
  function nativeCall(op, args){
    return new Promise(function(resolve){
      if (!NATIVE){ resolve(null); return; }
      var id = ++nativeSeq;
      nativeWaiting[id] = resolve;
      NATIVE.postMessage(JSON.stringify({id:id, op:op, args:args || {}}));
    });
  }
  if (NATIVE){
    document.documentElement.classList.add('native');
    NATIVE.onmessage = function(ev){
      var m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
      if (m.event){ onNativeEvent(m.event); return; }
      var done = nativeWaiting[m.id];
      if (done){ delete nativeWaiting[m.id]; done(m.result); }
    };
  }

  /* ============== constants ============== */
  var DAY_DEFS = [
    {key:'mon', label:'월요일', short:'월'},
    {key:'tue', label:'화요일', short:'화'},
    {key:'wed', label:'수요일', short:'수'},
    {key:'thu', label:'목요일', short:'목'},
    {key:'fri', label:'금요일', short:'금'},
    {key:'sat', label:'토요일', short:'토'},
    {key:'sun', label:'일요일', short:'일'}
  ];
  var DEFAULT_CATEGORIES = [
    {id:'sleep',    name:'수면',     color:'#3987e5'},
    {id:'work',     name:'업무',     color:'#d95926'},
    {id:'exercise', name:'운동',     color:'#199e70'},
    {id:'meal',     name:'식사',     color:'#c98500'},
    {id:'commute',  name:'이동',     color:'#d55181'},
    {id:'rest',     name:'휴식',     color:'#008300'},
    {id:'personal', name:'개인시간', color:'#9085e9'},
    {id:'etc',      name:'기타',     color:'#e66767'}
  ];

  function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }

  function tpl(prefix, rows){
    return rows.map(function(r,i){ return {id:prefix+'_'+i, start:r[0], end:r[1], catId:r[2], label:r[3]}; });
  }
  function blocksOffice(p){ return tpl(p, [
    [0,420,'sleep','수면'], [420,450,'meal','아침식사'], [450,510,'commute','출근'],
    [510,720,'work','오전 업무'], [720,780,'meal','점심식사'], [780,1080,'work','오후 업무'],
    [1080,1140,'commute','퇴근'], [1140,1200,'exercise','운동'], [1200,1260,'meal','저녁식사'],
    [1260,1380,'personal','자유시간'], [1380,1440,'sleep','수면']
  ]);}
  function blocksWfh(p){ return tpl(p, [
    [0,420,'sleep','수면'], [420,450,'meal','아침식사'], [450,510,'personal','준비'],
    [510,720,'work','오전 업무'], [720,780,'meal','점심식사'], [780,1080,'work','오후 업무'],
    [1080,1140,'exercise','운동'], [1140,1200,'meal','저녁식사'], [1200,1380,'personal','자유시간'],
    [1380,1440,'sleep','수면']
  ]);}
  function blocksRelax(p){ return tpl(p, [
    [0,480,'sleep','수면'], [480,540,'meal','아침식사'], [540,720,'personal','자유시간'],
    [720,780,'meal','점심식사'], [780,900,'rest','휴식'], [900,1020,'exercise','운동'],
    [1020,1140,'personal','자유시간'], [1140,1200,'meal','저녁식사'], [1200,1380,'rest','휴식'],
    [1380,1440,'sleep','수면']
  ]);}
  function blocksOuting(p){ return tpl(p, [
    [0,480,'sleep','수면'], [480,540,'meal','아침식사'], [540,660,'personal','준비'],
    [660,780,'commute','이동'], [780,840,'meal','점심 약속'], [840,1080,'personal','외부 일정'],
    [1080,1140,'commute','이동'], [1140,1200,'meal','저녁식사'], [1200,1380,'rest','휴식'],
    [1380,1440,'sleep','수면']
  ]);}

  function buildDefaultState(){
    var days = DAY_DEFS.map(function(d){
      var weekend = d.key === 'sat' || d.key === 'sun';
      var caseA = weekend
        ? {id:d.key+'_a', name:'집에서 휴식 (예시)', blocks:blocksRelax(d.key+'a')}
        : {id:d.key+'_a', name:'사무실 출근 (예시)', blocks:blocksOffice(d.key+'a')};
      var caseB = weekend
        ? {id:d.key+'_b', name:'외출 (예시)', blocks:blocksOuting(d.key+'b')}
        : {id:d.key+'_b', name:'재택근무 (예시)', blocks:blocksWfh(d.key+'b')};
      return {key:d.key, label:d.label, short:d.short, cases:[caseA, caseB], activeCaseId:caseA.id};
    });
    return {
      categories: DEFAULT_CATEGORIES.map(function(c){ return {id:c.id, name:c.name, color:c.color}; }),
      days: days,
      isExample: true
    };
  }

  /* ============== state ============== */
  var state = buildDefaultState();
  try{
    var cached = localStorage.getItem(LS_CACHE_KEY);
    if (cached){ var c = JSON.parse(cached); if (c && c.days) state = c; }
  }catch(e){}

  var ui = {
    mode: 'display',
    displayScope: 'daily',   // 'daily' | 'weekly'
    dayIndex: (new Date().getDay() + 6) % 7,
    editingBlockId: null,
    caseDialog: null,        // {mode:'add'|'rename'}
    caseMoveOpen: false,     // "이동" (to another day) row in the case bar
    caseDeleteArmed: false,
    refreshArmed: false,
    catDeleteArmedId: null,
    tokenDialogOpen: false,
    clockSel: null,          // highlighted clock slice: {key:'dayKey|caseId', start:minute}
    dayChangedAt: 0,
    nativePanelOpen: false   // Android app: notification/app settings panel
  };
  var nativeInfo = null;     // {settings, perms, info} for that panel, filled by refreshNativeInfo()
  var dirty = false;
  var saving = false;
  var loadingRemote = true;
  var canWrite = false;
  try{ canWrite = !!localStorage.getItem(TOKEN_KEY); }catch(e){}

  /* ============== helpers ============== */
  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  function fmtMin(min){
    var h = Math.floor(min/60), m = min%60;
    if (h >= 24) { h = 24; m = 0; }
    return pad2(h)+':'+pad2(m);
  }
  function fmtDur(min){
    var h = Math.floor(min/60), m = min%60;
    if (h && m) return h+'시간 '+m+'분';
    if (h) return h+'시간';
    return m+'분';
  }
  function catById(id){
    for (var i=0;i<state.categories.length;i++) if (state.categories[i].id === id) return state.categories[i];
    return null;
  }
  function dayByIndex(i){ return state.days[i]; }
  function activeCase(day){
    for (var i=0;i<day.cases.length;i++) if (day.cases[i].id === day.activeCaseId) return day.cases[i];
    return day.cases[0];
  }
  function sortedBlocks(c){
    return c.blocks.slice().sort(function(a,b){ return a.start - b.start; });
  }
  function markOverlaps(blocks){
    var flags = {};
    for (var i=0;i<blocks.length-1;i++){
      if (blocks[i].end > blocks[i+1].start){ flags[blocks[i].id] = true; flags[blocks[i+1].id] = true; }
    }
    return flags;
  }
  function segmentsWithGaps(blocks){
    var segs = [];
    var cursor = 0;
    blocks.forEach(function(b){
      if (b.start > cursor) segs.push({start:cursor, end:b.start, catId:null});
      segs.push({start:Math.max(b.start,cursor), end:b.end, catId:b.catId, label:b.label});
      cursor = Math.max(cursor, b.end);
    });
    if (cursor < 1440) segs.push({start:cursor, end:1440, catId:null});
    return segs;
  }
  function markDirty(){ if (canWrite) dirty = true; renderApp(); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function cacheLocally(){ try{ localStorage.setItem(LS_CACHE_KEY, JSON.stringify(state)); }catch(e){} }

  /* ============== clock (SVG) ============== */
  function polar(cx, cy, r, minutes){
    var angle = (minutes/1440)*360 - 90;
    var rad = angle * Math.PI/180;
    return {x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad)};
  }
  function donutPath(cx, cy, rOuter, rInner, startMin, endMin){
    var span = endMin - startMin;
    var large = span > 720 ? 1 : 0;
    var p1 = polar(cx,cy,rOuter,startMin), p2 = polar(cx,cy,rOuter,endMin);
    var p3 = polar(cx,cy,rInner,endMin),   p4 = polar(cx,cy,rInner,startMin);
    return 'M '+p1.x.toFixed(2)+' '+p1.y.toFixed(2)
      +' A '+rOuter.toFixed(2)+' '+rOuter.toFixed(2)+' 0 '+large+' 1 '+p2.x.toFixed(2)+' '+p2.y.toFixed(2)
      +' L '+p3.x.toFixed(2)+' '+p3.y.toFixed(2)
      +' A '+rInner.toFixed(2)+' '+rInner.toFixed(2)+' 0 '+large+' 0 '+p4.x.toFixed(2)+' '+p4.y.toFixed(2)+' Z';
  }
  // the desktop widget shows its clocks small, so it uses a slightly tighter ring and larger text
  var CLOCK_BIG = WIDGET_VIEW;
  function clockCenterName(name){
    var max = CLOCK_BIG ? 5 : 8;
    return name.length > max ? name.slice(0,max-1)+'…' : name;
  }
  // one slice of the ring; clicking it highlights it (see selectClockSeg)
  function segInfo(seg){
    var cat = seg.catId ? catById(seg.catId) : null;
    var name = seg.catId ? (cat ? cat.name : '?') : '미지정';
    return {
      name: name,
      color: seg.catId ? (cat && cat.color) || 'var(--unassigned)' : 'var(--unassigned)',
      textColor: seg.catId && cat ? cat.color : 'var(--text)',   // the unassigned navy is unreadable as text
      memo: seg.label && seg.label !== name ? seg.label : '',
      time: fmtMin(seg.start)+'–'+fmtMin(seg.end)
    };
  }
  function renderClockSVG(day, c, size, showNow){
    var big = CLOCK_BIG;
    var cx = size/2, cy = size/2;
    var rOuter = size*(big?0.38:0.42), rInner = size*(big?0.23:0.26);
    var key = day.key+'|'+c.id;
    var sel = ui.clockSel && ui.clockSel.key === key ? ui.clockSel.start : null;
    var selInfo = null;
    var blocks = sortedBlocks(c);
    var segs = segmentsWithGaps(blocks);
    var parts = [], segParts = [], selPart = '';
    parts.push('<circle cx="'+cx+'" cy="'+cy+'" r="'+(rOuter+1.5)+'" fill="none" stroke="var(--border-soft)" stroke-width="1"></circle>');
    segs.forEach(function(seg){
      if (seg.end <= seg.start) return;   // swallowed by an overlapping block
      var info = segInfo(seg);
      var g = '<g class="seg'+(seg.start===sel?' sel':'')+'" data-start="'+seg.start+'" data-end="'+seg.end+'" data-name="'+esc(info.name)+'" data-memo="'+esc(info.memo)+'" data-color="'+esc(info.textColor)+'">'
        + '<title>'+esc(info.name+(info.memo?' · '+info.memo:'')+' '+info.time)+'</title>'
        + '<path d="'+donutPath(cx,cy,rOuter,rInner,seg.start,seg.end)+'" fill="'+info.color+'" stroke="var(--gap-ring)" stroke-width="1.5"></path>'
        + '</g>';
      // the highlighted slice goes last so it is drawn over its neighbours
      if (seg.start === sel){ selPart = g; selInfo = info; } else segParts.push(g);
    });
    parts.push('<g class="segs">'+segParts.join('')+selPart+'</g>');
    for (var h=0; h<24; h++){
      var maj = h % 3 === 0;
      var p0 = polar(cx,cy,rOuter+2,h*60);
      var p1 = polar(cx,cy,rOuter + (maj? size*(big?0.035:0.045) : size*(big?0.017:0.022)), h*60);
      parts.push('<line x1="'+p0.x.toFixed(2)+'" y1="'+p0.y.toFixed(2)+'" x2="'+p1.x.toFixed(2)+'" y2="'+p1.y.toFixed(2)+'" stroke="var(--text-mute)" stroke-width="'+(maj?1.6:1)+'" stroke-linecap="round"></line>');
      if (maj){
        if (big){
          var bp = polar(cx,cy,rOuter+size*0.075,h*60);
          parts.push('<text x="'+bp.x.toFixed(2)+'" y="'+bp.y.toFixed(2)+'" text-anchor="middle" dominant-baseline="central" font-size="'+(size*0.05)+'" fill="var(--text-mute)" font-family="IBM Plex Sans, sans-serif">'+h+'</text>');
        } else {
          var lp = polar(cx,cy,rOuter+size*0.10,h*60);
          parts.push('<text x="'+lp.x.toFixed(2)+'" y="'+(lp.y+4).toFixed(2)+'" text-anchor="middle" font-size="'+(size*0.032)+'" fill="var(--text-mute)" font-family="IBM Plex Sans, sans-serif">'+h+'</text>');
        }
      }
    }
    if (showNow){
      var now = new Date();
      var nowMin = now.getHours()*60 + now.getMinutes();
      // the hand starts at the inner ring so it doesn't cross the "지금" text in the middle
      var np = polar(cx,cy,rOuter+size*0.03,nowMin);
      var ip = polar(cx,cy,rInner-size*0.02,nowMin);
      parts.push('<line x1="'+ip.x.toFixed(2)+'" y1="'+ip.y.toFixed(2)+'" x2="'+np.x.toFixed(2)+'" y2="'+np.y.toFixed(2)+'" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"></line>');
      parts.push('<circle cx="'+ip.x.toFixed(2)+'" cy="'+ip.y.toFixed(2)+'" r="4" fill="var(--accent)"></circle>');
    }
    // today's clock shows what should be happening now in the middle; other days show day + case
    // (in the widget the case name sits under each clock, so other days only show the day)
    var centerTop = day.short+'요일', centerSub = big ? '' : c.name, centerColor = 'var(--text)', ariaNow = '';
    if (showNow){
      var st = nowStatus();
      var nm = nowStatusName(st);
      centerTop = clockCenterName(nm);
      centerSub = fmtDur(st.remaining)+' 남음';
      if (st.cur && st.cat) centerColor = st.cat.color;
      ariaNow = ', 지금 '+nm+' '+centerSub;
    }
    var topF = size*(big?0.10:0.062), subF = size*(big?0.062:0.036);
    var topY = cy + size*(big?0.01:-0.018), subY = cy + size*(big?0.09:0.047), memoY = subY + subF*1.3;
    var textAt = function(cls, y, font, fill, weight, family, s){
      return '<text class="'+cls+'" x="'+cx+'" y="'+y.toFixed(2)+'" text-anchor="middle" font-size="'+font.toFixed(2)+'"'+(weight?' font-weight="'+weight+'"':'')+' fill="'+fill+'" font-family="'+family+'">'+esc(s)+'</text>';
    };
    var center = '<g class="c-def">'
      + textAt('', topY, topF, centerColor, 800, 'Sora, sans-serif', centerTop)
      + textAt('', subY, subF, 'var(--text-mute)', 0, 'IBM Plex Sans, sans-serif', centerSub)
      + '</g>'
      // filled in for the highlighted slice (here when re-rendering, in selectClockSeg when clicked)
      + '<g class="c-sel">'
      + textAt('c-sel-name', topY, topF, selInfo ? selInfo.textColor : 'var(--text)', 800, 'Sora, sans-serif', selInfo ? clockCenterName(selInfo.name) : '')
      + textAt('c-sel-time', subY, subF, 'var(--text-dim)', 600, 'IBM Plex Sans, sans-serif', selInfo ? selInfo.time : '')
      + textAt('c-sel-memo', memoY, subF*0.92, 'var(--text-mute)', 0, 'IBM Plex Sans, sans-serif', selInfo ? clockCenterName(selInfo.memo) : '')
      + '</g>';
    return '<svg class="clock'+(selInfo?' has-sel':'')+'" data-key="'+esc(key)+'" viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" style="max-width:100%;height:auto;display:block;" role="img" aria-label="'+esc(day.label+' '+c.name+' 24시간 루틴'+ariaNow)+'">'
      + parts.join('') + center + '</svg>';
  }

  /* click a slice: it pops out, the rest dims, and the middle shows its name, time and memo.
     Clicking it again (or the empty middle) puts the clock back. One highlighted slice at a time. */
  function selectClockSeg(svg, g){
    Array.prototype.forEach.call(document.querySelectorAll('svg.clock.has-sel'), function(other){
      if (other === svg) return;
      other.classList.remove('has-sel');
      var s = other.querySelector('.seg.sel'); if (s) s.classList.remove('sel');
    });
    var cur = svg.querySelector('.seg.sel');
    if (cur) cur.classList.remove('sel');
    if (!g || g === cur){ svg.classList.remove('has-sel'); ui.clockSel = null; return; }
    g.parentNode.appendChild(g);   // draw it over its neighbours
    void g.getBoundingClientRect(); // re-attached node: let it settle first so the pop-out animates
    g.classList.add('sel');
    svg.classList.add('has-sel');
    ui.clockSel = {key: svg.getAttribute('data-key'), start: parseInt(g.getAttribute('data-start'),10)};
    var start = ui.clockSel.start, end = parseInt(g.getAttribute('data-end'),10);
    var nameEl = svg.querySelector('.c-sel-name');
    nameEl.textContent = clockCenterName(g.getAttribute('data-name'));
    nameEl.setAttribute('fill', g.getAttribute('data-color'));
    svg.querySelector('.c-sel-time').textContent = fmtMin(start)+'–'+fmtMin(end);
    svg.querySelector('.c-sel-memo').textContent = clockCenterName(g.getAttribute('data-memo') || '');
  }
  function clearClockSel(){
    if (!ui.clockSel) return;
    ui.clockSel = null;
    Array.prototype.forEach.call(document.querySelectorAll('svg.clock.has-sel'), function(svg){
      svg.classList.remove('has-sel');
      var s = svg.querySelector('.seg.sel'); if (s) s.classList.remove('sel');
    });
  }

  /* ============== render ============== */
  var app = document.getElementById('app');

  function isTodayIndex(i){ return i === ((new Date().getDay()+6)%7); }

  // what today's active case says should be happening now, plus what comes next
  function nowStatus(){
    var now = new Date();
    var nowMin = now.getHours()*60 + now.getMinutes();
    var ti = (now.getDay()+6)%7;
    var blocks = sortedBlocks(activeCase(dayByIndex(ti)));
    var cur = null, prevEnd = 0, next = null, nextTomorrow = false;
    blocks.forEach(function(b){
      if (!cur && b.start <= nowMin && nowMin < b.end) cur = b;
      if (b.end <= nowMin && b.end > prevEnd) prevEnd = b.end;
      if (!next && b.start > nowMin) next = b;
    });
    if (!next){
      next = sortedBlocks(activeCase(dayByIndex((ti+1)%7)))[0] || null;
      nextTomorrow = !!next;
    }
    var st = { cur: cur, next: next, nextTomorrow: nextTomorrow, cat: cur ? catById(cur.catId) : null };
    if (cur){
      st.start = cur.start; st.end = cur.end; st.remaining = cur.end - nowMin;
    } else {
      st.start = prevEnd;
      st.end = (next && !nextTomorrow) ? next.start : 1440;
      st.remaining = (next ? (nextTomorrow ? 1440 + next.start : next.start) : 1440) - nowMin;
    }
    return st;
  }
  function nowStatusName(st){ return st.cur ? ((st.cat||{}).name || '?') : '미지정 시간'; }

  function nowStatusHtml(){
    var st = nowStatus();
    var color = st.cur ? ((st.cat||{}).color || 'var(--unassigned)') : 'var(--unassigned)';
    var memo = st.cur && st.cur.label ? '<span class="memo"> · '+esc(st.cur.label)+'</span>' : '';
    var sub = '<span class="tabular">'+fmtMin(st.start)+'–'+fmtMin(st.end)+'</span> · <b class="tabular">'+fmtDur(st.remaining)+' 남음</b>';
    if (st.next){
      var nc = catById(st.next.catId) || {name:'?'};
      sub += ' · 다음: '+esc(st.next.label || nc.name)+' <span class="tabular">'+(st.nextTomorrow?'내일 ':'')+fmtMin(st.next.start)+'</span>';
    }
    return '<div id="now-status" class="nowbar" style="--nowbar-color:'+color+'" role="status">'
      + '<span class="nowbar-tag">지금</span>'
      + '<div class="nowbar-body"><div class="nowbar-title">'+esc(nowStatusName(st))+memo+'</div>'
      + '<div class="nowbar-sub">'+sub+'</div></div></div>';
  }

  // the widget's day list keeps where it was scrolled across the 30s redraws (same day only)
  var widgetListDay = -1;
  function nowHHMM(){ var d = new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }

  function renderWidget(){

  /* ---- Android app: notification / app settings (what the app's old settings screen had) ---- */
  function nativePanelHtml(){
    var head = '<div class="panel"><div class="panel-title"><h2>알림 · 앱 설정</h2>'
      + '<button class="icon-btn" data-action="toggle-native-panel">닫기</button></div>';
    if (!nativeInfo) return head + '<div class="hint">불러오는 중…</div></div>';
    var st = nativeInfo.settings || {}, pm = nativeInfo.perms || {}, info = nativeInfo.info || {};
    var sw = function(key, title, sub, dependent){
      var off = dependent && !st.notify;
      return '<label class="nset-row switchwrap'+(off?' is-off':'')+'">'
        + '<span class="nset-text"><span class="nset-title">'+title+'</span>'+(sub?'<span class="nset-sub">'+sub+'</span>':'')+'</span>'
        + '<input type="checkbox" data-native-setting="'+key+'"'+(st[key]?' checked':'')+(off?' disabled':'')+'>'
        + '<span class="switch-track"><span class="switch-thumb"></span></span></label>';
    };
    var perm = function(ok, title, sub, action, label){
      return '<div class="nset-row"><span class="nset-text"><span class="nset-title">'+title+'</span><span class="nset-sub">'+sub+'</span></span>'
        + (ok ? '<span class="nset-ok">허용됨</span>' : '<button class="btn primary" data-action="'+action+'">'+label+'</button>') + '</div>';
    };
    var last = info.lastSync ? new Date(info.lastSync) : null;
    var lastText = last ? (last.getMonth()+1)+'/'+last.getDate()+' '+pad2(last.getHours())+':'+pad2(last.getMinutes()) : '없음';
    return head
      + '<div class="nset">'
      + sw('notify', '상태 변경 알림', '루틴상 지금 할 일이 바뀌면 알려줘요', false)
      + sw('sound', '소리', '', true)
      + sw('vibrate', '진동', '', true)
      + sw('notifyGaps', '미지정 시간 시작도 알림', '블록이 끝나고 빈 시간이 시작될 때', true)
      + '</div>'
      + '<div class="nset-actions"><button class="icon-btn" data-action="native-test">테스트 알림 보내기</button>'
      + '<button class="icon-btn" data-action="native-open-notify">시스템 알림 설정</button></div>'
      + '<div class="panel-title" style="margin-top:6px;"><h2>권한</h2></div>'
      + '<div class="nset">'
      + perm(pm.notifications, '알림', '꺼져 있으면 알림이 오지 않아요', 'native-perm-notify', '허용')
      + perm(pm.exactAlarm, '정확한 알람', '없으면 알림이 몇 분 늦을 수 있어요', 'native-perm-exact', '허용')
      + perm(pm.battery, '배터리 최적화 제외', '목록에서 Weekly Routine을 \'제한 없음\'으로 바꿔주세요', 'native-perm-battery', '설정 열기')
      + '</div>'
      + '<div class="hint">홈 화면을 길게 누르고 위젯 → Weekly Routine → \'오늘 루틴\'을 추가하세요. '
      +   '저장하면 위젯과 알림에 바로 반영돼요. 마지막 동기화 '+lastText+(info.version?' · 앱 '+esc(info.version):'')+'</div>'
      + '</div>';
  }
  async function refreshNativeInfo(){
    var r = await Promise.all([nativeCall('getSettings'), nativeCall('getPermissions'), nativeCall('getInfo')]);
    nativeInfo = {settings:r[0], perms:r[1], info:r[2]};
    if (ui.nativePanelOpen) renderApp();
  }
  var nativePanelScrollY = 0;
  function toggleNativePanel(){
    ui.nativePanelOpen = !ui.nativePanelOpen;
    // opening: start at the top; closing: back to where the page was
    if (ui.nativePanelOpen) nativePanelScrollY = window.scrollY;
    renderApp();
    window.scrollTo(0, ui.nativePanelOpen ? 0 : nativePanelScrollY);
    if (ui.nativePanelOpen) refreshNativeInfo();
  }
  async function setNativeSetting(key, value){
    await nativeCall('setSetting', {key:key, value:value});
    refreshNativeInfo();
  }
  async function nativeTestNotification(){
    var r = await nativeCall('sendTestNotification');
    if (r && r.ok) toast('테스트 알림을 보냈어요.');
    else toast(r && r.reason === 'permission' ? '알림 권한을 먼저 허용해주세요.' : '루틴을 아직 불러오지 못했어요.');
  }
  function onNativeEvent(name){
    // a permission was answered, or we came back from system settings
    if ((name === 'permissions' || name === 'resume') && ui.nativePanelOpen) refreshNativeInfo();
  }
  // the app keeps the edit token too (the widget's case picker uses it): whichever side has one shares it
  async function syncTokenWithNative(){
    if (!NATIVE) return;
    var mine = '';
    try{ mine = localStorage.getItem(TOKEN_KEY) || ''; }catch(e){}
    var theirs = await nativeCall('getToken') || '';
    if (mine){ if (mine !== theirs) nativeCall('setToken', {token:mine}); return; }
    if (theirs){
      try{ localStorage.setItem(TOKEN_KEY, theirs); }catch(e){}
      canWrite = true;
      renderApp();
    }
  }

  // which list a narrow clock shows: 'timeline' (default) or 'totals'; a per-device preference
  var LEGEND_MODE_KEY = 'weekly-routine-legend-mode';
  var legendMode = 'timeline';
  try{ if (localStorage.getItem(LEGEND_MODE_KEY) === 'totals') legendMode = 'totals'; }catch(e){}

  function timelineFor(c, today){
    var blocks = sortedBlocks(c);
    if (!blocks.length) return '<div class="tl-empty">블록이 없어요</div>';
    var cur = today ? nowStatus().cur : null;
    return blocks.map(function(b){
      var cat = catById(b.catId) || {color:'var(--unassigned)', name:'?'};
      return '<div class="tlitem'+(b === cur ? ' now' : '')+'"><span class="swatch" style="background:'+cat.color+'"></span>'
        + '<span class="tm tabular">'+fmtMin(b.start)+'–'+fmtMin(b.end)+'</span>'
        + '<span class="nm">'+esc(b.label || cat.name)+'</span></div>';
    }).join('');
  }
  // the box under a clock: header (title + switch, narrow only) and the two lists
  function legendBoxHtml(c, today){
    return '<div class="lgbox" data-mode="'+legendMode+'">'
      + '<div class="lghead"><span class="lgtitle"><span class="t-timeline">시간별 상태</span><span class="t-totals">카테고리별 총시간</span></span>'
      + '<label class="switchwrap dual lgswitch" title="시간별 상태 ↔ 카테고리별 총시간"><input type="checkbox" data-action="legend-mode" aria-label="시간별 상태 / 카테고리별 총시간 전환"'+(legendMode==='totals'?' checked':'')+'>'
      + '<span class="switch-track"><span class="switch-thumb"></span></span></label></div>'
      + '<div class="lgcols">'
      + '<div class="lgcol timeline"><div class="lgtitle">시간별 상태</div><div class="legend">'+timelineFor(c, today)+'</div></div>'
      + '<div class="lgcol totals"><div class="lgtitle">카테고리별 총시간</div><div class="legend">'+legendFor(c)+'</div></div>'
      + '</div></div>';
  }
  // flip every clock's list in place (no re-render, so scroll positions stay put)
  function setLegendMode(mode){
    legendMode = mode;
    try{ localStorage.setItem(LEGEND_MODE_KEY, mode); }catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll('.lgbox'), function(box){ box.setAttribute('data-mode', mode); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-action="legend-mode"]'), function(cb){ cb.checked = mode === 'totals'; });
  }

  function legendFor(c){
    var totals = {};
    c.blocks.forEach(function(b){ totals[b.catId] = (totals[b.catId]||0) + (b.end-b.start); });
    var gapTotal = 1440 - c.blocks.reduce(function(s,b){ return s+(b.end-b.start); },0);
    var items = state.categories.filter(function(cat){ return totals[cat.id]; }).map(function(cat){
      return '<div class="legenditem"><span class="swatch" style="background:'+cat.color+'"></span>'+esc(cat.name)+'<span class="dur tabular">'+fmtDur(totals[cat.id])+'</span></div>';
    });
    if (gapTotal > 0){
      items.push('<div class="legenditem"><span class="swatch" style="background:var(--unassigned)"></span>미지정<span class="dur tabular">'+fmtDur(gapTotal)+'</span></div>');
    }
    return items.join('');
  }

  /* ---- widget: picking a case ----
     With the edit token on this PC it is saved to the server (so every device follows);
     without one it is kept on this PC only and wins over the server's choice for that day. */
  function caseOverrides(){
    try{ return JSON.parse(localStorage.getItem(CASE_OVERRIDES_KEY) || '{}') || {}; }catch(e){ return {}; }
  }
  function setCaseOverride(dayKey, caseId){
    var o = caseOverrides();
    if (caseId) o[dayKey] = caseId; else delete o[dayKey];
    try{ localStorage.setItem(CASE_OVERRIDES_KEY, JSON.stringify(o)); }catch(e){}
  }
  function applyCaseOverrides(){
    var o = caseOverrides();
    state.days.forEach(function(d){
      var id = o[d.key];
      if (id && d.cases.some(function(cs){ return cs.id === id; })) d.activeCaseId = id;
    });
  }
  async function widgetSetCase(dayIndex, caseId){
    var dayKey = state.days[dayIndex].key;
    state.days[dayIndex].activeCaseId = caseId;
    setCaseOverride(dayKey, caseId);   // shows right away, and sticks if the save below fails
    renderApp();
    if (!API_BASE || API_BASE.indexOf('__API_BASE__') !== -1){ toast('데모 페이지라 서버에 저장하거나 불러오지 않아요.'); return; }
    if (!canWrite){ toast('이 PC에만 적용했어요. 편집 토큰을 넣으면 모든 기기에 반영돼요.'); return; }
    var token = '';
    try{ token = localStorage.getItem(TOKEN_KEY) || ''; }catch(e){}
    try{
      // change only this day's case on top of the latest saved routine, not on our possibly older copy
      var res = await fetch(API_BASE + '/state', {cache:'no-store'});
      var latest = res.ok ? await res.json() : null;
      if (!latest || !latest.days || !latest.days[dayIndex]) throw new Error('no state');
      latest.days[dayIndex].activeCaseId = caseId;
      var post = await fetch(API_BASE + '/state', {
        method: 'POST',
        headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+token},
        body: JSON.stringify(latest)
      });
      if (post.status === 401){
        try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
        canWrite = false;
        toast('편집 토큰이 올바르지 않아 이 PC에만 적용했어요.');
        return;
      }
      if (!post.ok) throw new Error('HTTP '+post.status);
      state = latest;
      cacheLocally();
      setCaseOverride(dayKey, null);
      renderApp();
      toast('저장했어요. 모든 기기에 반영돼요.');
    }catch(e){
      toast('서버에 저장하지 못해 이 PC에만 적용했어요.');

  function submitCaseDialog(ev){

    var input = document.getElementById('case-dialog-input');
    var name = (input.value || '').trim().slice(0,40);
    var errEl = document.getElementById('case-dialog-err');
    if (!name){
      if (errEl) errEl.innerHTML = '<span class="formerr">이름을 입력해주세요</span>';
      return;
    }
    var isDup = day.cases.some(function(cs){
      if (ui.caseDialog.mode === 'rename' && cs.id === day.activeCaseId) return false;
      return cs.name.trim().toLowerCase() === name.toLowerCase();
    });
    if (isDup){
      if (errEl) errEl.innerHTML = '<span class="formerr">이미 같은 이름의 케이스가 있어요. 다른 이름을 입력해주세요.</span>';
      return;
    }
    if (ui.caseDialog.mode === 'rename'){
      activeCase(day).name = name;
    } else {
      var nc = {id: uid(day.key), name: name, blocks: []};
      day.cases.push(nc);
      day.activeCaseId = nc.id;
    }
    ui.caseDialog = null;
    markDirty();
  }
  function duplicateCase(){
    var day = dayByIndex(ui.dayIndex);
    var c = activeCase(day);
    var nc = {id: uid(day.key), name: c.name + ' 사본', blocks: c.blocks.map(function(b){ return {id: uid(day.key), start:b.start, end:b.end, catId:b.catId, label:b.label}; })};
    day.cases.push(nc);
    day.activeCaseId = nc.id;

  // move the selected case to another day; the day it leaves keeps at least one case
  function openCaseMove(){
    if (dayByIndex(ui.dayIndex).cases.length <= 1) return;
    ui.caseDialog = null; ui.caseDeleteArmed = false;
    ui.caseMoveOpen = true;
    renderApp();
  }
  function cancelCaseMove(){ ui.caseMoveOpen = false; renderApp(); }
  function submitCaseMove(ev){
    ev.preventDefault();
    var from = dayByIndex(ui.dayIndex);
    var toIndex = parseInt(document.getElementById('case-move-target').value, 10);
    var to = dayByIndex(toIndex);
    if (from.cases.length <= 1 || !to || to === from) return;
    var idx = from.cases.findIndex(function(cs){ return cs.id === from.activeCaseId; });
    if (idx < 0) idx = 0;
    var cs = from.cases.splice(idx, 1)[0];
    from.activeCaseId = from.cases[Math.max(0, idx-1)].id;
    // ids stay unique within the new day, and a name already used there gets a number
    if (to.cases.some(function(x){ return x.id === cs.id; })) cs.id = uid(to.key);
    var base = cs.name, n = 2;
    var taken = function(name){ return to.cases.some(function(x){ return x.name.trim().toLowerCase() === name.trim().toLowerCase(); }); };
    while (taken(cs.name)) cs.name = base + ' ' + (n++);
    to.cases.push(cs);
    to.activeCaseId = cs.id;
    ui.caseMoveOpen = false;
    ui.dayIndex = toIndex; ui.dayChangedAt = Date.now(); ui.editingBlockId = null;
    toast(from.label + '의 \'' + base + '\'을(를) ' + to.label + '로 옮겼어요'
      + (cs.name !== base ? ' (같은 이름이 있어 \'' + cs.name + '\'(으)로 바꿨어요)' : '') + '. 저장을 눌러 반영하세요.');
    markDirty();
  }

  var deleteArmTimer = null;

      renderApp();
      clearTimeout(deleteArmTimer);
      deleteArmTimer = setTimeout(function(){ ui.caseDeleteArmed = false; renderApp(); }, 4000);

    day.cases.splice(idx,1);
    day.activeCaseId = day.cases[Math.max(0,idx-1)].id;
    markDirty();
  }

  async function exportJson(){
    var payload = JSON.stringify(state, null, 2);
    if (NATIVE){
      var r = await nativeCall('saveFile', {name:'weekly-routine.json', content:payload});
      if (r && r.ok) toast('내보냈어요.');
      else if (!(r && r.cancelled)) toast('파일로 저장하지 못했어요.');
      return;
    }
    var blob = new Blob([payload], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'weekly-routine.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }
  function importJsonClick(){ document.getElementById('import-file').click(); }
  function handleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var next = JSON.parse(reader.result);
        if (!next || !next.days || !next.categories) throw new Error('형식 오류');
        next.isExample = false;
        state = next;
        ui.editingBlockId = null;
        markDirty();
        toast('가져왔어요. 저장 버튼을 눌러 반영하세요.');
      }catch(e){ toast('올바른 JSON 파일이 아니에요.'); }
    };
    reader.readAsText(file);
  }

  /* ============== remote sync ============== */
  // resolves true when fresh state was fetched from the server
  async function loadRemote(){
    if (!API_BASE || API_BASE.indexOf('__API_BASE__') !== -1){ loadingRemote = false; return false; }
    var ok = false;
    try{
      var res = await fetch(API_BASE + '/state', {cache:'no-store'});
      if (res.ok){
        var data = await res.json();
        if (data && data.days){
          state = data; cacheLocally();
          nativeCall('onState', {json: JSON.stringify(data)});
        }
        ok = true;
      }
    }catch(e){ /* offline: keep whatever we already have (cache or defaults) */ }
    loadingRemote = false;
    return ok;
  }

  /* manual refresh button: re-fetch the latest saved state (e.g. after editing on another device).
     With unsaved edits it asks for a second tap first, since those edits would be discarded. */
  var refreshing = false;
  var refreshArmTimer = null;
  async function refreshNow(){
    if (refreshing || saving) return;
    if (!API_BASE || API_BASE.indexOf('__API_BASE__') !== -1){
      toast('데모 페이지라 서버에 저장하거나 불러오지 않아요.');
      return;
    }
    if (dirty && !ui.refreshArmed){
      ui.refreshArmed = true;
      renderApp();
      toast('저장하지 않은 변경사항이 있어요. 한 번 더 누르면 버리고 새로 불러와요.');
      clearTimeout(refreshArmTimer);
      refreshArmTimer = setTimeout(function(){ ui.refreshArmed = false; renderApp(); }, 4000);
      return;
    }
    clearTimeout(refreshArmTimer);
    ui.refreshArmed = false;
    refreshing = true; renderApp();
    var ok = await loadRemote();
    refreshing = false;
    if (ok){ dirty = false; ui.editingBlockId = null; resetTransientUI(); }
    renderApp();
    toast(ok ? '최신 내용을 불러왔어요.' : '불러오지 못했어요. 인터넷 연결을 확인해주세요.');
  }


  async function saveState(){
    if (saving) return;
    if (!API_BASE || API_BASE.indexOf('__API_BASE__') !== -1){
      toast('데모 페이지라 서버에 저장하거나 불러오지 않아요.');
      return;
    }
    saving = true; renderApp();
    state.isExample = false;
    var token = '';
    try{ token = localStorage.getItem(TOKEN_KEY) || ''; }catch(e){}
    try{
      var res = await fetch(API_BASE + '/state', {
        method: 'POST',
        headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+token},
        body: JSON.stringify(state)
      });
      if (res.status === 401){
        toast('토큰이 올바르지 않아요. 편집 잠금을 풀고 다시 입력해주세요.');
        try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
        nativeCall('setToken', {token:''});
        canWrite = false; ui.mode = 'display';
      } else if (!res.ok){
        toast('저장하지 못했습니다. (오류 '+res.status+')');
      } else {
        dirty = false;
        cacheLocally();
        nativeCall('onState', {json: JSON.stringify(state)});   // the phone's widget/alarms follow at once
        toast('저장했어요. 어느 기기에서 열어도 같은 내용이 보여요.');
      }
    }catch(e){
      toast('네트워크 오류로 저장하지 못했습니다.');
    } finally {
      saving = false; renderApp();
    }
  }

  /* ============== events ============== */
  app_root_listeners();
  function app_root_listeners(){
    document.addEventListener('click', function(ev){
      var clock = ev.target.closest('svg.clock');
      if (clock){
        if (Date.now() - lastDragAt > 300) selectClockSeg(clock, ev.target.closest('.seg'));
        return;
      }
      clearClockSel();
      var el = ev.target.closest('[data-action]');
      if (!el) return;
      var action = el.dataset.action;
      if (action === 'set-day') setDay(parseInt(el.dataset.dayIndex,10));
      else if (action === 'add-case') addCase();
      else if (action === 'rename-case') renameCase();
      else if (action === 'duplicate-case') duplicateCase();
      else if (action === 'delete-case') deleteCase();
      else if (action === 'move-case') openCaseMove();
      else if (action === 'cancel-case-move') cancelCaseMove();
      else if (action === 'cancel-case-dialog') cancelCaseDialog();
      else if (action === 'edit-block') editBlock(el.dataset.blockId);
      else if (action === 'delete-block') deleteBlock(el.dataset.blockId);
      else if (action === 'cancel-edit-block') cancelEditBlock();
      else if (action === 'add-category') addCategory();
      else if (action === 'delete-category') deleteCategory(el.dataset.catId);
      else if (action === 'export-json') exportJson();
      else if (action === 'import-json') importJsonClick();
      else if (action === 'save') saveState();
      else if (action === 'open-token-dialog') openTokenDialog();
      else if (action === 'cancel-token-dialog') cancelTokenDialog();
      else if (action === 'lock') lockEditing();
      else if (action === 'refresh') refreshNow();
      else if (action === 'toggle-native-panel') toggleNativePanel();
      else if (action === 'native-test') nativeTestNotification();
      else if (action === 'native-open-notify') nativeCall('openNotificationSettings');
      else if (action === 'native-perm-notify') nativeCall('requestNotificationPermission');
      else if (action === 'native-perm-exact') nativeCall('openExactAlarmSettings');
      else if (action === 'native-perm-battery') nativeCall('openBatterySettings');
    });
    document.addEventListener('change', function(ev){
      var t = ev.target;
      if (t.matches && t.matches('[data-action="set-case"]')) setCase(t.value);
      else if (t.matches && t.matches('[data-action="set-case-for-day"]')) setCaseForDay(parseInt(t.dataset.dayIndex,10), t.value);
      else if (t.matches && t.matches('[data-action="widget-set-case"]')) widgetSetCase(parseInt(t.dataset.dayIndex,10), t.value);
      else if (t.matches && t.matches('[data-action="cat-color"]')) setCatColor(t.dataset.catId, t.value);
      else if (t.id === 'import-file' && t.files && t.files[0]) handleImportFile(t.files[0]);
      else if (t.id === 'edit-toggle') toggleEditMode();
      else if (t.id === 'scope-toggle') toggleDisplayScope();
      else if (t.matches && t.matches('[data-action="legend-mode"]')) setLegendMode(t.checked ? 'totals' : 'timeline');
      else if (t.matches && t.matches('[data-native-setting]')) setNativeSetting(t.getAttribute('data-native-setting'), t.checked);
    });
    document.addEventListener('input', function(ev){
      var t = ev.target;
      if (t.matches && t.matches('[data-action="cat-name"]')) setCatName(t.dataset.catId, t.value);
    });
    document.addEventListener('submit', function(ev){
      if (ev.target && ev.target.id === 'block-form') submitBlockForm(ev);
      else if (ev.target && ev.target.id === 'case-dialog-form') submitCaseDialog(ev);
      else if (ev.target && ev.target.id === 'case-move-form') submitCaseMove(ev);
      else if (ev.target && ev.target.id === 'token-dialog-form') submitTokenDialog(ev);
    });
    window.addEventListener('beforeunload', function(ev){
      if (dirty){ ev.preventDefault(); ev.returnValue = ''; }
    });
  }

  // everything time-driven (clock hand, "지금", remaining time, the widget's HH:mm) moves in whole
  // minutes, so redraw right at each minute boundary — and not while the page can't be seen
  function minuteTick(){
    if (document.hidden) return;
    // the widget goes back to today 2 minutes after swiping away (and after midnight)
    if (WIDGET_VIEW && !isTodayIndex(ui.dayIndex) && Date.now() - ui.dayChangedAt > 2*60*1000){
      ui.dayIndex = (new Date().getDay() + 6) % 7;
      clearClockSel();
    }
    if (ui.mode === 'display'){ renderApp(); return; }
    // edit mode: a full re-render would wipe the form being typed in, so only swap the "지금" bar
    var bar = document.getElementById('now-status');
    if (bar) bar.outerHTML = nowStatusHtml();
  }
  var minuteTimer = null;
  function scheduleMinuteTick(){
    clearTimeout(minuteTimer);
    minuteTimer = setTimeout(function(){ minuteTick(); scheduleMinuteTick(); }, 60000 - Date.now() % 60000 + 50);
  }
  scheduleMinuteTick();
  // back in view (tab switched back, app reopened, PC unlocked): catch up at once
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden){ minuteTick(); scheduleMinuteTick(); }
  });

  /* drag-to-scroll the weekly day strip with the mouse (touch scrolls natively) */
  var dragScroll = null;
  var lastDragAt = 0;   // a drag/swipe that ends on a clock shouldn't also count as clicking a slice
  document.addEventListener('mousedown', function(ev){
    var grid = ev.target.closest('#daygrid');
    if (!grid) return;
    dragScroll = { grid: grid, startX: ev.pageX, startScroll: grid.scrollLeft, moved: false };
  });
  document.addEventListener('mousemove', function(ev){
    if (!dragScroll) return;
    var dx = ev.pageX - dragScroll.startX;
    if (!dragScroll.moved && Math.abs(dx) > 4){
      dragScroll.moved = true;
      dragScroll.grid.classList.add('dragging');
    }
    if (dragScroll.moved){
      ev.preventDefault();
      dragScroll.grid.scrollLeft = dragScroll.startScroll - dx;
    }
  });
  function endDragScroll(){
    if (dragScroll && dragScroll.moved) lastDragAt = Date.now();
    if (dragScroll && dragScroll.grid) dragScroll.grid.classList.remove('dragging');
    dragScroll = null;
  }
  document.addEventListener('mouseup', endDragScroll);
  document.addEventListener('mouseleave', endDragScroll);

  /* swipe left/right to move a day in the daily display view (mouse drag or touch swipe) */
  var swipeState = null;
  document.addEventListener('pointerdown', function(ev){
    var zone = ev.target.closest('#daily-swipe');
    if (!zone) return;
    if (ev.target.closest('select,button,input,a')) return;
    swipeState = { startX: ev.clientX, startY: ev.clientY };
  });
  document.addEventListener('pointerup', function(ev){
    if (!swipeState) return;
    var dx = ev.clientX - swipeState.startX;
    var dy = ev.clientY - swipeState.startY;
    swipeState = null;
    if (Math.abs(dx) > 10) lastDragAt = Date.now();
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5){
      var dir = dx < 0 ? 1 : -1; // swipe left -> next day, swipe right -> previous day
      setDay((ui.dayIndex + dir + 7) % 7);
    }
  });
  document.addEventListener('pointercancel', function(){ swipeState = null; });

  /* desktop app: drag the top handle to move, the corner grip to resize, right-click for its menu */
  if (HOST){
    document.body.insertAdjacentHTML('beforeend',
      '<div class="whandle move" data-host="move" title="끌어서 위젯 이동 · 우클릭하면 메뉴">⠿ 이동</div>'
      + '<div class="whandle grip" data-host="resize" title="끌어서 크기 조절"></div>');
    document.addEventListener('mousedown', function(ev){
      var h = ev.button === 0 && ev.target.closest('[data-host]');
      if (!h) return;
      ev.preventDefault();
      HOST.postMessage(h.getAttribute('data-host'));
    });
    document.addEventListener('contextmenu', function(ev){
      ev.preventDefault();
      HOST.postMessage('menu');
    });
  }

  /* ============== boot ============== */
  renderApp();
  loadRemote().then(renderApp);
  syncTokenWithNative();
  // the desktop widget stays open for days, so it pulls edits made on other devices by itself
  if (WIDGET_VIEW){
    setInterval(function(){ loadRemote().then(renderApp); }, 10*60*1000);
  }

})();
</script>
</body>
</html>
