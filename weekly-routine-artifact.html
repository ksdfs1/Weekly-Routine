<title>Weekly Routine Clock</title>
<style id="app-style">
  :root{
    --bg:#080d1a;
    --bg-grad:#0c1428;
    --surface:#111a30;
    --surface-2:#182545;
    --surface-3:#22315a;
    --border:#28365a;
    --border-soft:#1b2846;
    --text:#eef1fb;
    --text-dim:#a7b2cf;
    --text-mute:#6d7897;
    --accent:#f5b95c;
    --accent-ink:#241505;
    --danger:#e66767;
    --gap-ring:#0a0f1e;
    --unassigned:#243354;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  body{ background: radial-gradient(1100px 700px at 15% -8%, var(--bg-grad), var(--bg) 60%); color:var(--text); }
  #app{
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width:960px; margin:0 auto;
    padding-inline:16px; padding-block:22px 40px;
    display:flex; flex-direction:column; gap:18px;
  }
  h1,h2,h3{ font-family:"Sora", ui-sans-serif, system-ui, sans-serif; margin:0; letter-spacing:-0.01em; text-wrap:balance; }
  .tabular{ font-variant-numeric:tabular-nums; }

  /* ---- top bar ---- */
  .topbar{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand h1{ font-size:1.35rem; font-weight:800; color:var(--text); }
  .brand p{ margin:0; font-size:.8rem; color:var(--text-mute); }
  .modebtns{ display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:4px; }
  .modebtn{ appearance:none; border:none; background:transparent; color:var(--text-dim); font:inherit; font-weight:600; font-size:.85rem; padding:8px 16px; border-radius:999px; cursor:pointer; }
  .modebtn.active{ background:var(--accent); color:var(--accent-ink); }
  .readonly-badge{ font-size:.72rem; font-weight:600; color:var(--text-mute); border:1px solid var(--border); border-radius:999px; padding:4px 10px; white-space:nowrap; }

  /* ---- day tabs ---- */
  .daytabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .daytab{ appearance:none; flex:0 0 auto; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font:inherit; font-weight:600; font-size:.85rem; padding:9px 14px; border-radius:12px; cursor:pointer; }
  .daytab.active{ background:var(--surface-3); color:var(--text); border-color:var(--accent); }
  .daytab.today::after{ content:"·오늘"; font-weight:500; color:var(--accent); margin-left:3px; font-size:.7rem; }

  /* ---- case bar ---- */
  .casebar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .caseselect{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:8px 10px; font:inherit; font-size:.85rem; min-width:160px; }
  .icon-btn{ appearance:none; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font:inherit; font-size:.78rem; font-weight:600; padding:8px 11px; border-radius:10px; cursor:pointer; white-space:nowrap; }
  .icon-btn:hover{ border-color:var(--accent); color:var(--text); }
  .icon-btn.danger:hover{ border-color:var(--danger); color:var(--danger); }

  /* ---- panels ---- */
  .panel{ background:var(--surface); border:1px solid var(--border-soft); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .panel-title{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .panel-title h2{ font-size:.95rem; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; }
  .hint{ font-size:.78rem; color:var(--text-mute); line-height:1.5; }

  /* ---- block form ---- */
  .blockform{ display:flex; flex-wrap:wrap; align-items:end; gap:10px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:.7rem; color:var(--text-mute); font-weight:600; }
  .timepair{ display:flex; gap:4px; align-items:center; }
  select, input[type="text"]{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 8px; font:inherit; font-size:.82rem; }
  select:focus, input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .field.grow{ flex:1 1 160px; }
  .btn{ appearance:none; border:1px solid transparent; border-radius:10px; padding:9px 16px; font:inherit; font-weight:700; font-size:.83rem; cursor:pointer; }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); }
  .btn.primary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.ghost{ background:var(--surface-2); color:var(--text-dim); border-color:var(--border); }
  .btn.ghost:hover{ color:var(--text); border-color:var(--accent); }
  .formerr{ color:var(--danger); font-size:.78rem; font-weight:600; }

  /* ---- block list ---- */
  .blocklist{ display:flex; flex-direction:column; border-radius:12px; overflow:hidden; border:1px solid var(--border-soft); }
  .blockrow{ display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--surface-2); }
  .blockrow + .blockrow{ border-top:1px solid var(--border-soft); }
  .blockrow.overlap{ box-shadow:inset 3px 0 0 var(--danger); }
  .swatch{ width:11px; height:11px; border-radius:3px; flex:0 0 auto; }
  .blockrow .time{ font-size:.8rem; color:var(--text-dim); white-space:nowrap; }
  .blockrow .lbl{ flex:1 1 auto; font-size:.85rem; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .blockrow .warn{ font-size:.7rem; color:var(--danger); font-weight:700; white-space:nowrap; }
  .rowbtn{ appearance:none; border:none; background:transparent; color:var(--text-mute); cursor:pointer; font-size:.95rem; padding:4px 6px; line-height:1; }
  .rowbtn:hover{ color:var(--accent); }
  .rowbtn.del:hover{ color:var(--danger); }
  .empty{ padding:16px; text-align:center; color:var(--text-mute); font-size:.85rem; }

  /* ---- categories ---- */
  .catlist{ display:flex; flex-direction:column; gap:6px; }
  .catrow{ display:flex; align-items:center; gap:8px; }
  .catrow input[type="color"]{ width:30px; height:30px; padding:0; border:1px solid var(--border); border-radius:8px; background:none; cursor:pointer; }
  .catrow input[type="text"]{ flex:1 1 auto; min-width:0; }

  /* ---- clock ---- */
  .clocksection{ display:flex; flex-wrap:wrap; gap:22px; align-items:center; justify-content:center; }
  .clockwrap{ flex:0 0 auto; }
  .clockmeta{ flex:1 1 220px; min-width:220px; display:flex; flex-direction:column; gap:10px; }
  .clockmeta h3{ font-size:1.05rem; color:var(--text); }
  .clockmeta .sub{ font-size:.8rem; color:var(--text-mute); margin-top:-6px;}
  .legend{ display:flex; flex-direction:column; gap:7px; }
  .legenditem{ display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--text-dim); }
  .legenditem .dur{ margin-left:auto; color:var(--text-mute); font-size:.76rem; }
  .now-line{ font-size:.8rem; color:var(--accent); font-weight:700; }

  /* ---- data tools / save bar ---- */
  .savebar{ position:sticky; bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:10px 14px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .savebar .status{ font-size:.78rem; color:var(--text-mute); }
  .savebar .status.dirty{ color:var(--accent); font-weight:600; }
  .datatools{ display:flex; gap:8px; flex-wrap:wrap; }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--surface-3); border:1px solid var(--accent); color:var(--text); font-size:.82rem; font-weight:600; padding:10px 18px; border-radius:999px; box-shadow:0 12px 30px rgba(0,0,0,.4); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  @media (max-width:520px){
    .clocksection{ flex-direction:column; }
    .clockmeta{ min-width:0; width:100%; }
    .blockform{ flex-direction:column; align-items:stretch; }
    .field.grow{ flex:1 1 auto; }
  }
  @media (prefers-reduced-motion:reduce){
    .toast{ transition:none; }
  }
</style>
<div id="app"></div>
<script id="state-data" type="application/json">null</script>
<script id="app-script">
(function(){
  "use strict";

  /* ============== capture own source (for self-publish) ============== */
  var STYLE_SRC = (document.getElementById('app-style') || {}).textContent || '';
  var SCRIPT_SRC = (document.currentScript || document.getElementById('app-script') || {}).textContent || '';

  /* ============== constants ============== */
  var LS_KEY = 'weekly-routine-state-v1';
  var DAY_DEFS = [
    {key:'mon', label:'월요일', short:'월'},
    {key:'tue', label:'화요일', short:'화'},
    {key:'wed', label:'수요일', short:'수'},
    {key:'thu', label:'목요일', short:'목'},
    {key:'fri', label:'금요일', short:'금'},
    {key:'sat', label:'토요일', short:'토'},
    {key:'sun', label:'일요일', short:'일'}
  ];
  var DEFAULT_CATEGORIES = [
    {id:'sleep',    name:'수면',     color:'#3987e5'},
    {id:'work',     name:'업무',     color:'#d95926'},
    {id:'exercise', name:'운동',     color:'#199e70'},
    {id:'meal',     name:'식사',     color:'#c98500'},
    {id:'commute',  name:'이동',     color:'#d55181'},
    {id:'rest',     name:'휴식',     color:'#008300'},
    {id:'personal', name:'개인시간', color:'#9085e9'},
    {id:'etc',      name:'기타',     color:'#e66767'}
  ];

  function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }

  function tpl(prefix, rows){
    return rows.map(function(r,i){ return {id:prefix+'_'+i, start:r[0], end:r[1], catId:r[2], label:r[3]}; });
  }
  function blocksOffice(p){ return tpl(p, [
    [0,420,'sleep','수면'], [420,450,'meal','아침식사'], [450,510,'commute','출근'],
    [510,720,'work','오전 업무'], [720,780,'meal','점심식사'], [780,1080,'work','오후 업무'],
    [1080,1140,'commute','퇴근'], [1140,1200,'exercise','운동'], [1200,1260,'meal','저녁식사'],
    [1260,1380,'personal','자유시간'], [1380,1440,'sleep','수면']
  ]);}
  function blocksWfh(p){ return tpl(p, [
    [0,420,'sleep','수면'], [420,450,'meal','아침식사'], [450,510,'personal','준비'],
    [510,720,'work','오전 업무'], [720,780,'meal','점심식사'], [780,1080,'work','오후 업무'],
    [1080,1140,'exercise','운동'], [1140,1200,'meal','저녁식사'], [1200,1380,'personal','자유시간'],
    [1380,1440,'sleep','수면']
  ]);}
  function blocksRelax(p){ return tpl(p, [
    [0,480,'sleep','수면'], [480,540,'meal','아침식사'], [540,720,'personal','자유시간'],
    [720,780,'meal','점심식사'], [780,900,'rest','휴식'], [900,1020,'exercise','운동'],
    [1020,1140,'personal','자유시간'], [1140,1200,'meal','저녁식사'], [1200,1380,'rest','휴식'],
    [1380,1440,'sleep','수면']
  ]);}
  function blocksOuting(p){ return tpl(p, [
    [0,480,'sleep','수면'], [480,540,'meal','아침식사'], [540,660,'personal','준비'],
    [660,780,'commute','이동'], [780,840,'meal','점심 약속'], [840,1080,'personal','외부 일정'],
    [1080,1140,'commute','이동'], [1140,1200,'meal','저녁식사'], [1200,1380,'rest','휴식'],
    [1380,1440,'sleep','수면']
  ]);}

  function buildDefaultState(){
    var days = DAY_DEFS.map(function(d){
      var weekend = d.key === 'sat' || d.key === 'sun';
      var caseA = weekend
        ? {id:d.key+'_a', name:'집에서 휴식 (예시)', blocks:blocksRelax(d.key+'a')}
        : {id:d.key+'_a', name:'사무실 출근 (예시)', blocks:blocksOffice(d.key+'a')};
      var caseB = weekend
        ? {id:d.key+'_b', name:'외출 (예시)', blocks:blocksOuting(d.key+'b')}
        : {id:d.key+'_b', name:'재택근무 (예시)', blocks:blocksWfh(d.key+'b')};
      return {key:d.key, label:d.label, short:d.short, cases:[caseA, caseB], activeCaseId:caseA.id};
    });
    return {
      categories: DEFAULT_CATEGORIES.map(function(c){ return {id:c.id, name:c.name, color:c.color}; }),
      days: days,
      isExample: true
    };
  }

  /* ============== state ============== */
  var state = null;
  try {
    var raw = (document.getElementById('state-data') || {}).textContent;
    var parsed = raw ? JSON.parse(raw) : null;
    state = parsed && parsed.days ? parsed : buildDefaultState();
  } catch (e) { state = buildDefaultState(); }

  var ui = {
    mode: 'display',
    dayIndex: (new Date().getDay() + 6) % 7,
    editingBlockId: null,
    formOpen: false,
    caseDialog: null,        // {mode:'add'|'rename'}
    caseDeleteArmed: false,
    catDeleteArmedId: null
  };
  var dirty = false;
  var saving = false;
  var claudeArtifact = null;
  var canWrite = false;
  var standalone = true; // true when the claude runtime bridge isn't present at all

  /* ============== helpers ============== */
  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  function fmtMin(min){
    var h = Math.floor(min/60), m = min%60;
    if (h >= 24) { h = 24; m = 0; }
    return pad2(h)+':'+pad2(m);
  }
  function fmtDur(min){
    var h = Math.floor(min/60), m = min%60;
    if (h && m) return h+'시간 '+m+'분';
    if (h) return h+'시간';
    return m+'분';
  }
  function catById(id){
    for (var i=0;i<state.categories.length;i++) if (state.categories[i].id === id) return state.categories[i];
    return null;
  }
  function dayByIndex(i){ return state.days[i]; }
  function activeCase(day){
    for (var i=0;i<day.cases.length;i++) if (day.cases[i].id === day.activeCaseId) return day.cases[i];
    return day.cases[0];
  }
  function sortedBlocks(c){
    return c.blocks.slice().sort(function(a,b){ return a.start - b.start; });
  }
  function markOverlaps(blocks){
    var flags = {};
    for (var i=0;i<blocks.length-1;i++){
      if (blocks[i].end > blocks[i+1].start){ flags[blocks[i].id] = true; flags[blocks[i+1].id] = true; }
    }
    return flags;
  }
  function segmentsWithGaps(blocks){
    var segs = [];
    var cursor = 0;
    blocks.forEach(function(b){
      if (b.start > cursor) segs.push({start:cursor, end:b.start, catId:null});
      segs.push({start:Math.max(b.start,cursor), end:b.end, catId:b.catId, label:b.label});
      cursor = Math.max(cursor, b.end);
    });
    if (cursor < 1440) segs.push({start:cursor, end:1440, catId:null});
    return segs;
  }
  function markDirty(){ if (canWrite) dirty = true; renderApp(); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ============== clock (SVG) ============== */
  function polar(cx, cy, r, minutes){
    var angle = (minutes/1440)*360 - 90;
    var rad = angle * Math.PI/180;
    return {x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad)};
  }
  function donutPath(cx, cy, rOuter, rInner, startMin, endMin){
    var span = endMin - startMin;
    var large = span > 720 ? 1 : 0;
    var p1 = polar(cx,cy,rOuter,startMin), p2 = polar(cx,cy,rOuter,endMin);
    var p3 = polar(cx,cy,rInner,endMin),   p4 = polar(cx,cy,rInner,startMin);
    return 'M '+p1.x.toFixed(2)+' '+p1.y.toFixed(2)
      +' A '+rOuter.toFixed(2)+' '+rOuter.toFixed(2)+' 0 '+large+' 1 '+p2.x.toFixed(2)+' '+p2.y.toFixed(2)
      +' L '+p3.x.toFixed(2)+' '+p3.y.toFixed(2)
      +' A '+rInner.toFixed(2)+' '+rInner.toFixed(2)+' 0 '+large+' 0 '+p4.x.toFixed(2)+' '+p4.y.toFixed(2)+' Z';
  }
  function renderClockSVG(day, c, size, showNow){
    var cx = size/2, cy = size/2;
    var rOuter = size*0.42, rInner = size*0.26;
    var blocks = sortedBlocks(c);
    var segs = segmentsWithGaps(blocks);
    var parts = [];
    parts.push('<circle cx="'+cx+'" cy="'+cy+'" r="'+(rOuter+1.5)+'" fill="none" stroke="var(--border-soft)" stroke-width="1"></circle>');
    segs.forEach(function(seg){
      var color = seg.catId ? (catById(seg.catId)||{}).color || 'var(--unassigned)' : 'var(--unassigned)';
      parts.push('<path d="'+donutPath(cx,cy,rOuter,rInner,seg.start,seg.end)+'" fill="'+color+'" stroke="var(--gap-ring)" stroke-width="1.5"></path>');
    });
    // hour ticks
    for (var h=0; h<24; h++){
      var maj = h % 3 === 0;
      var p0 = polar(cx,cy,rOuter+2,h*60);
      var p1 = polar(cx,cy,rOuter + (maj? size*0.045 : size*0.022), h*60);
      parts.push('<line x1="'+p0.x.toFixed(2)+'" y1="'+p0.y.toFixed(2)+'" x2="'+p1.x.toFixed(2)+'" y2="'+p1.y.toFixed(2)+'" stroke="var(--text-mute)" stroke-width="'+(maj?1.6:1)+'" stroke-linecap="round"></line>');
      if (maj){
        var lp = polar(cx,cy,rOuter+size*0.10,h*60);
        parts.push('<text x="'+lp.x.toFixed(2)+'" y="'+(lp.y+4).toFixed(2)+'" text-anchor="middle" font-size="'+(size*0.032)+'" fill="var(--text-mute)" font-family="IBM Plex Sans, sans-serif">'+h+'</text>');
      }
    }
    // now needle
    if (showNow){
      var now = new Date();
      var nowMin = now.getHours()*60 + now.getMinutes();
      var np = polar(cx,cy,rOuter+size*0.03,nowMin);
      parts.push('<line x1="'+cx+'" y1="'+cy+'" x2="'+np.x.toFixed(2)+'" y2="'+np.y.toFixed(2)+'" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"></line>');
      parts.push('<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="var(--accent)"></circle>');
    }
    var centerLines = [
      '<text x="'+cx+'" y="'+(cy-6)+'" text-anchor="middle" font-size="'+(size*0.062)+'" font-weight="800" fill="var(--text)" font-family="Sora, sans-serif">'+esc(day.short+'요일')+'</text>',
      '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="'+(size*0.036)+'" fill="var(--text-mute)" font-family=\'IBM Plex Sans, sans-serif\'>'+esc(c.name)+'</text>'
    ];
    return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" role="img" aria-label="'+esc(day.label+' '+c.name+' 24시간 루틴')+'">'
      + parts.join('') + centerLines.join('') + '</svg>';
  }

  /* ============== render ============== */
  var app = document.getElementById('app');

  function isTodayIndex(i){ return i === ((new Date().getDay()+6)%7); }

  function renderApp(){
    var day = dayByIndex(ui.dayIndex);
    var c = activeCase(day);
    var html = '';

    html += '<div class="topbar">'
      + '<div class="brand"><h1>Weekly Routine</h1><p>5분 단위로 요일별 루틴을 편집하고, 24시간 원형 시계로 시현해요</p></div>'
      + '<div style="display:flex;align-items:center;gap:10px;">'
      + (canWrite ? '' : '<span class="readonly-badge">읽기 전용</span>')
      + '<div class="modebtns">'
      + '<button class="modebtn'+(ui.mode==='display'?' active':'')+'" data-action="set-mode" data-mode="display">시현</button>'
      + (canWrite ? '<button class="modebtn'+(ui.mode==='edit'?' active':'')+'" data-action="set-mode" data-mode="edit">편집</button>' : '')
      + '</div></div></div>';

    html += '<div class="daytabs">' + state.days.map(function(d,i){
      return '<button class="daytab'+(i===ui.dayIndex?' active':'')+(isTodayIndex(i)?' today':'')+'" data-action="set-day" data-day-index="'+i+'">'+esc(d.short)+'</button>';
    }).join('') + '</div>';

    html += '<div class="casebar">'
      + '<select class="caseselect" data-action="set-case">' + day.cases.map(function(cs){
          return '<option value="'+cs.id+'"'+(cs.id===day.activeCaseId?' selected':'')+'>'+esc(cs.name)+'</option>';
        }).join('') + '</select>';
    if (canWrite){
      if (ui.caseDialog){
        var dialogDefault = ui.caseDialog.mode === 'rename' ? c.name : '새 케이스';
        html += '<form id="case-dialog-form" style="display:flex;gap:6px;align-items:center;">'
          + '<input type="text" id="case-dialog-input" value="'+esc(dialogDefault)+'" maxlength="40" style="min-width:160px;">'
          + '<button type="submit" class="btn primary">'+(ui.caseDialog.mode==='rename'?'저장':'추가')+'</button>'
          + '<button type="button" class="icon-btn" data-action="cancel-case-dialog">취소</button>'
          + '</form>';
      } else {
        html += '<button class="icon-btn" data-action="add-case">+ 케이스 추가</button>'
          + '<button class="icon-btn" data-action="rename-case">이름 변경</button>'
          + '<button class="icon-btn" data-action="duplicate-case">복제</button>'
          + '<button class="icon-btn danger" data-action="delete-case"'+(day.cases.length<=1?' disabled':'')+'>'+(ui.caseDeleteArmed?'정말 삭제할까요?':'삭제')+'</button>';
      }
    }
    html += '</div>';

    if (ui.mode === 'display'){
      html += renderDisplayPanel(day, c);
    } else {
      html += renderEditPanel(day, c);
    }

    html += '<div id="toast" class="toast"></div>';
    app.innerHTML = html;
    bindTimeSelectDependencies();
    if (ui.caseDialog){
      var dialogInput = document.getElementById('case-dialog-input');
      if (dialogInput){ dialogInput.focus(); dialogInput.select(); }
    }
  }

  function legendFor(c){
    var totals = {};
    c.blocks.forEach(function(b){ totals[b.catId] = (totals[b.catId]||0) + (b.end-b.start); });
    var gapTotal = 1440 - c.blocks.reduce(function(s,b){ return s+(b.end-b.start); },0);
    var items = state.categories.filter(function(cat){ return totals[cat.id]; }).map(function(cat){
      return '<div class="legenditem"><span class="swatch" style="background:'+cat.color+'"></span>'+esc(cat.name)+'<span class="dur tabular">'+fmtDur(totals[cat.id])+'</span></div>';
    });
    if (gapTotal > 0){
      items.push('<div class="legenditem"><span class="swatch" style="background:var(--unassigned)"></span>미지정<span class="dur tabular">'+fmtDur(gapTotal)+'</span></div>');
    }
    return items.join('');
  }

  function renderDisplayPanel(day, c){
    var today = isTodayIndex(ui.dayIndex);
    var svg = renderClockSVG(day, c, 340, today);
    var now = new Date();
    var nowStr = pad2(now.getHours())+':'+pad2(now.getMinutes());
    return '<div class="panel">'
      + '<div class="clocksection">'
      + '<div class="clockwrap">'+svg+'</div>'
      + '<div class="clockmeta">'
      + '<h3>'+esc(day.label)+' · '+esc(c.name)+'</h3>'
      + (today ? '<div class="now-line tabular">● 지금 '+nowStr+'</div>' : '<div class="sub">오늘 요일이 아니에요</div>')
      + '<div class="legend">'+legendFor(c)+'</div>'
      + '</div></div></div>';
  }

  function renderEditPanel(day, c){
    var blocks = sortedBlocks(c);
    var overlaps = markOverlaps(blocks);
    var editing = ui.editingBlockId ? blocks.filter(function(b){return b.id===ui.editingBlockId;})[0] : null;

    var hourOpts = function(max, sel){
      var out = '';
      for (var h=0; h<=max; h++) out += '<option value="'+h+'"'+(h===sel?' selected':'')+'>'+pad2(h)+'</option>';
      return out;
    };
    var minOpts = function(sel){
      var out = '';
      for (var m=0; m<60; m+=5) out += '<option value="'+m+'"'+(m===sel?' selected':'')+'>'+pad2(m)+'</option>';
      return out;
    };
    var sH = editing ? Math.floor(editing.start/60) : (blocks.length ? Math.floor(blocks[blocks.length-1].end/60)%24 : 7);
    var sM = editing ? editing.start%60 : (blocks.length ? blocks[blocks.length-1].end%60 : 0);
    var eMinDefault = editing ? editing.end : Math.min(1440, (blocks.length ? blocks[blocks.length-1].end : 420) + 60);
    var eH = editing ? Math.floor(editing.end/60) : Math.floor(eMinDefault/60);
    var eM = editing ? editing.end%60 : eMinDefault%60;

    var form = '<form id="block-form" class="blockform">'
      + '<div class="field"><label>시작</label><div class="timepair">'
      + '<select id="bf-start-h">'+hourOpts(23, sH)+'</select><span>:</span><select id="bf-start-m">'+minOpts(sM)+'</select>'
      + '</div></div>'
      + '<div class="field"><label>종료</label><div class="timepair">'
      + '<select id="bf-end-h">'+hourOpts(24, eH)+'</select><span>:</span><select id="bf-end-m">'+minOpts(eM===60?0:eM)+'</select>'
      + '</div></div>'
      + '<div class="field grow"><label>카테고리</label><select id="bf-cat">' + state.categories.map(function(cat){
          return '<option value="'+cat.id+'"'+(editing && editing.catId===cat.id?' selected':'')+'>'+esc(cat.name)+'</option>';
        }).join('') + '</select></div>'
      + '<div class="field grow"><label>메모(선택)</label><input type="text" id="bf-label" placeholder="예: 팀 회의" value="'+(editing?esc(editing.label||''):'')+'"></div>'
      + '<div class="field"><label>&nbsp;</label><button type="submit" class="btn primary">'+(editing?'수정 저장':'블록 추가')+'</button></div>'
      + (editing ? '<div class="field"><label>&nbsp;</label><button type="button" class="btn ghost" data-action="cancel-edit-block">취소</button></div>' : '')
      + '<div class="field" id="block-form-err"></div>'
      + '</form>';

    var rows = blocks.length ? blocks.map(function(b){
      var cat = catById(b.catId) || {color:'var(--unassigned)', name:'?'};
      return '<div class="blockrow'+(overlaps[b.id]?' overlap':'')+'">'
        + '<span class="swatch" style="background:'+cat.color+'"></span>'
        + '<span class="time tabular">'+fmtMin(b.start)+'–'+fmtMin(b.end)+'</span>'
        + '<span class="lbl">'+esc(b.label || cat.name)+'</span>'
        + (overlaps[b.id] ? '<span class="warn">겹침</span>' : '')
        + '<button class="rowbtn" title="수정" data-action="edit-block" data-block-id="'+b.id+'">✎</button>'
        + '<button class="rowbtn del" title="삭제" data-action="delete-block" data-block-id="'+b.id+'">✕</button>'
        + '</div>';
    }).join('') : '<div class="empty">아직 블록이 없어요. 위에서 첫 블록을 추가해보세요.</div>';

    var miniSvg = renderClockSVG(day, c, 200, isTodayIndex(ui.dayIndex));

    var catRows = state.categories.map(function(cat){
      var armed = ui.catDeleteArmedId === cat.id;
      return '<div class="catrow">'
        + '<input type="color" data-action="cat-color" data-cat-id="'+cat.id+'" value="'+cat.color+'">'
        + '<input type="text" data-action="cat-name" data-cat-id="'+cat.id+'" value="'+esc(cat.name)+'">'
        + '<button class="icon-btn danger" data-action="delete-category" data-cat-id="'+cat.id+'"'+(state.categories.length<=1?' disabled':'')+'>'+(armed?'정말요?':'삭제')+'</button>'
        + '</div>';
    }).join('');

    return ''
      + '<div class="panel">'
      + '<div class="panel-title"><h2>블록 편집 · '+esc(day.label)+' · '+esc(c.name)+'</h2></div>'
      + '<div class="hint">5분 단위로 시작·종료 시간을 지정해 블록을 추가하세요. 채워지지 않은 시간은 시계에 회색 "미지정"으로 표시돼요.</div>'
      + '<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;">'
      + '<div style="flex:1 1 320px;min-width:280px;display:flex;flex-direction:column;gap:10px;">' + form + '<div class="blocklist">' + rows + '</div></div>'
      + '<div style="flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;">' + miniSvg + '<span class="hint">실시간 미리보기</span></div>'
      + '</div></div>'
      + '<div class="panel">'
      + '<div class="panel-title"><h2>카테고리 관리</h2><button class="icon-btn" data-action="add-category">+ 카테고리 추가</button></div>'
      + '<div class="catlist">' + catRows + '</div>'
      + '</div>'
      + '<div class="savebar">'
      + '<span class="status'+(dirty?' dirty':'')+'">'+(saving?'저장하는 중…':(dirty?'저장하지 않은 변경사항이 있어요':'저장됨'))+'</span>'
      + '<div class="datatools">'
      + '<button class="icon-btn" data-action="export-json">JSON 내보내기</button>'
      + '<button class="icon-btn" data-action="import-json">JSON 가져오기</button>'
      + '<input type="file" id="import-file" accept="application/json" hidden>'
      + '<button class="btn primary" data-action="save" '+(saving?'disabled':'')+'>변경사항 저장</button>'
      + '</div></div>';
  }

  function bindTimeSelectDependencies(){
    var eh = document.getElementById('bf-end-h');
    var em = document.getElementById('bf-end-m');
    if (eh && em){
      var sync = function(){
        if (parseInt(eh.value,10) === 24){ em.value = '0'; em.disabled = true; } else { em.disabled = false; }
      };
      eh.addEventListener('change', sync);
      sync();
    }
  }

  /* ============== toast ============== */
  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  /* ============== actions ============== */
  function resetTransientUI(){ ui.caseDialog = null; ui.caseDeleteArmed = false; ui.catDeleteArmedId = null; }
  function setMode(m){ ui.mode = m; resetTransientUI(); renderApp(); }
  function setDay(i){ ui.dayIndex = i; ui.editingBlockId = null; resetTransientUI(); renderApp(); }
  function setCase(id){ dayByIndex(ui.dayIndex).activeCaseId = id; ui.editingBlockId = null; resetTransientUI(); markDirty(); }

  function addCase(){ ui.caseDialog = {mode:'add'}; renderApp(); }
  function renameCase(){ ui.caseDialog = {mode:'rename'}; renderApp(); }
  function cancelCaseDialog(){ ui.caseDialog = null; renderApp(); }
  function submitCaseDialog(ev){
    ev.preventDefault();
    var day = dayByIndex(ui.dayIndex);
    var input = document.getElementById('case-dialog-input');
    var name = (input.value || '').trim().slice(0,40);
    if (!name){ ui.caseDialog = null; renderApp(); return; }
    if (ui.caseDialog.mode === 'rename'){
      activeCase(day).name = name;
    } else {
      var nc = {id: uid(day.key), name: name, blocks: []};
      day.cases.push(nc);
      day.activeCaseId = nc.id;
    }
    ui.caseDialog = null;
    markDirty();
  }
  function duplicateCase(){
    var day = dayByIndex(ui.dayIndex);
    var c = activeCase(day);
    var nc = {id: uid(day.key), name: c.name + ' 사본', blocks: c.blocks.map(function(b){ return {id: uid(day.key), start:b.start, end:b.end, catId:b.catId, label:b.label}; })};
    day.cases.push(nc);
    day.activeCaseId = nc.id;
    markDirty();
  }
  var deleteArmTimer = null;
  function deleteCase(){
    var day = dayByIndex(ui.dayIndex);
    if (day.cases.length <= 1) return;
    if (!ui.caseDeleteArmed){
      ui.caseDeleteArmed = true;
      renderApp();
      clearTimeout(deleteArmTimer);
      deleteArmTimer = setTimeout(function(){ ui.caseDeleteArmed = false; renderApp(); }, 4000);
      return;
    }
    clearTimeout(deleteArmTimer);
    ui.caseDeleteArmed = false;
    var idx = day.cases.findIndex(function(cs){ return cs.id === day.activeCaseId; });
    day.cases.splice(idx,1);
    day.activeCaseId = day.cases[Math.max(0,idx-1)].id;
    markDirty();
  }

  function submitBlockForm(ev){
    ev.preventDefault();
    var day = dayByIndex(ui.dayIndex);
    var c = activeCase(day);
    var sh = parseInt(document.getElementById('bf-start-h').value,10);
    var sm = parseInt(document.getElementById('bf-start-m').value,10);
    var eh = parseInt(document.getElementById('bf-end-h').value,10);
    var em = eh === 24 ? 0 : parseInt(document.getElementById('bf-end-m').value,10);
    var catId = document.getElementById('bf-cat').value;
    var label = document.getElementById('bf-label').value.trim().slice(0,60);
    var start = sh*60+sm, end = eh*60+em;
    if (eh === 24) end = 1440;
    var errEl = document.getElementById('block-form-err');
    if (end <= start){
      errEl.innerHTML = '<span class="formerr">종료 시간은 시작 시간보다 늦어야 해요</span>';
      return;
    }
    if (ui.editingBlockId){
      var b = c.blocks.filter(function(x){return x.id===ui.editingBlockId;})[0];
      b.start = start; b.end = end; b.catId = catId; b.label = label;
      ui.editingBlockId = null;
    } else {
      c.blocks.push({id: uid(day.key), start:start, end:end, catId:catId, label:label});
    }
    markDirty();
  }

  function editBlock(id){ ui.editingBlockId = id; renderApp(); }
  function cancelEditBlock(){ ui.editingBlockId = null; renderApp(); }
  function deleteBlock(id){
    var c = activeCase(dayByIndex(ui.dayIndex));
    c.blocks = c.blocks.filter(function(b){ return b.id !== id; });
    if (ui.editingBlockId === id) ui.editingBlockId = null;
    markDirty();
  }

  function addCategory(){
    var c = {id: uid('cat'), name:'새 카테고리', color:'#8a93ad'};
    state.categories.push(c);
    markDirty();
  }
  function setCatColor(id, color){
    var cat = catById(id); if (cat){ cat.color = color; markDirty(); }
  }
  function setCatName(id, name){
    var cat = catById(id); if (cat){ cat.name = name.slice(0,20) || cat.name; dirty = true; }
  }
  var catDeleteArmTimer = null;
  function deleteCategory(id){
    var used = state.days.some(function(d){ return d.cases.some(function(c){ return c.blocks.some(function(b){ return b.catId===id; }); }); });
    if (used){ toast('이 카테고리를 사용 중인 블록이 있어 삭제할 수 없어요.'); return; }
    if (state.categories.length <= 1) return;
    if (ui.catDeleteArmedId !== id){
      ui.catDeleteArmedId = id;
      renderApp();
      clearTimeout(catDeleteArmTimer);
      catDeleteArmTimer = setTimeout(function(){ ui.catDeleteArmedId = null; renderApp(); }, 4000);
      return;
    }
    clearTimeout(catDeleteArmTimer);
    ui.catDeleteArmedId = null;
    state.categories = state.categories.filter(function(c){ return c.id !== id; });
    markDirty();
  }

  function exportJson(){
    var payload = JSON.stringify(state, null, 2);
    downloadOrShare(payload);
  }
  async function downloadOrShare(payload){
    try{
      if (window.claude && window.claude.use){
        var dl = await window.claude.use('downloads');
        if (dl){ await dl.save({filename:'weekly-routine.json', data:payload}); return; }
      }
    }catch(e){}
    toast('내보내기를 사용할 수 없어요.');
  }
  function importJsonClick(){ document.getElementById('import-file').click(); }
  function handleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var next = JSON.parse(reader.result);
        if (!next || !next.days || !next.categories) throw new Error('형식 오류');
        next.isExample = false;
        state = next;
        ui.editingBlockId = null;
        markDirty();
        toast('가져왔어요. 저장 버튼을 눌러 반영하세요.');
      }catch(e){ toast('올바른 JSON 파일이 아니에요.'); }
    };
    reader.readAsText(file);
  }

  /* ============== self-publish ============== */
  function buildFullDocument(s){
    var stateJson = JSON.stringify(s).replace(/</g, '\\u003c');
    return '<!DOCTYPE html>\n<html lang="ko">\n<head>\n'
      + '<meta charset="UTF-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
      + '<title>Weekly Routine Clock</title>\n'
      + '<style id="app-style">' + STYLE_SRC + '<' + '/style>\n'
      + '</head>\n<body>\n'
      + '<div id="app"></div>\n'
      + '<script id="state-data" type="application/json">' + stateJson + '<' + '/script>\n'
      + '<script id="app-script">' + SCRIPT_SRC + '<' + '/script>\n'
      + '</body>\n</html>';
  }

  async function saveState(){
    if (saving) return;
    saving = true; renderApp();
    state.isExample = false;
    try{
      if (claudeArtifact){
        await claudeArtifact.publish(buildFullDocument(state));
        try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
        dirty = false;
        toast('저장했습니다.');
      } else if (standalone){
        try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); dirty = false; toast('이 브라우저에 로컬로 저장했습니다.'); }
        catch(e){ toast('저장에 실패했어요.'); }
      } else {
        toast('저장 권한이 없어요. 소유자만 저장할 수 있어요.');
      }
    }catch(e){
      toast('저장하지 못했습니다. 잠시 후 다시 시도해주세요.');
    } finally {
      saving = false; renderApp();
    }
  }

  /* ============== events ============== */
  app_root_listeners();
  function app_root_listeners(){
    document.addEventListener('click', function(ev){
      var el = ev.target.closest('[data-action]');
      if (!el) return;
      var action = el.dataset.action;
      if (action === 'set-mode') setMode(el.dataset.mode);
      else if (action === 'set-day') setDay(parseInt(el.dataset.dayIndex,10));
      else if (action === 'add-case') addCase();
      else if (action === 'rename-case') renameCase();
      else if (action === 'duplicate-case') duplicateCase();
      else if (action === 'delete-case') deleteCase();
      else if (action === 'cancel-case-dialog') cancelCaseDialog();
      else if (action === 'edit-block') editBlock(el.dataset.blockId);
      else if (action === 'delete-block') deleteBlock(el.dataset.blockId);
      else if (action === 'cancel-edit-block') cancelEditBlock();
      else if (action === 'add-category') addCategory();
      else if (action === 'delete-category') deleteCategory(el.dataset.catId);
      else if (action === 'export-json') exportJson();
      else if (action === 'import-json') importJsonClick();
      else if (action === 'save') saveState();
    });
    document.addEventListener('change', function(ev){
      var t = ev.target;
      if (t.matches && t.matches('[data-action="set-case"]')) setCase(t.value);
      else if (t.matches && t.matches('[data-action="cat-color"]')) setCatColor(t.dataset.catId, t.value);
      else if (t.id === 'import-file' && t.files && t.files[0]) handleImportFile(t.files[0]);
    });
    document.addEventListener('input', function(ev){
      var t = ev.target;
      if (t.matches && t.matches('[data-action="cat-name"]')) setCatName(t.dataset.catId, t.value);
    });
    document.addEventListener('submit', function(ev){
      if (ev.target && ev.target.id === 'block-form') submitBlockForm(ev);
      else if (ev.target && ev.target.id === 'case-dialog-form') submitCaseDialog(ev);
    });
    window.addEventListener('beforeunload', function(ev){
      if (dirty){ ev.preventDefault(); ev.returnValue = ''; }
    });
  }

  /* live "now" refresh while viewing today in display mode */
  setInterval(function(){
    if (ui.mode === 'display' && isTodayIndex(ui.dayIndex)) renderApp();
  }, 30000);

  /* ============== capability bootstrap ============== */
  async function boot(){
    try{
      if (window.claude && window.claude.use){
        standalone = false;
        var user = null;
        try{ user = await window.claude.use('user'); }catch(e){}
        if (user){
          try{ canWrite = await user.canEdit(); }catch(e){ canWrite = false; }
        } else {
          canWrite = false;
        }
        try{ claudeArtifact = await window.claude.use('artifact'); }catch(e){ claudeArtifact = null; }
      } else {
        standalone = true;
        canWrite = true; // offline/dev fallback: allow local editing
      }
    }catch(e){}
    if (!canWrite) ui.mode = 'display';
    renderApp();
  }
  renderApp();
  boot();
})();
</script>
